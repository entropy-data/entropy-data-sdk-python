  /api/semantics/experimental/namespaces/{namespace}/ontology.yaml:
    parameters:
      - name: namespace
        in: path
        description: The namespace identifier.
        required: true
        example: main
        schema:
          type: string
    get:
      tags:
        - Semantics
      summary: Export a namespace as OSI ontology YAML
      description: >-
        EXPERIMENTAL Returns the entire namespace (concepts, shared properties, groups and
        relationships) as one OSI-compliant ontology YAML document — the natural unit for copying a
        namespace between instances. The namespace's own metadata travels in the document's root
        `custom_properties`: `display_name`, `read_only` and `owner` (the owning team's external id).
        Keys are omitted when unset.
      operationId: getSemanticOntologyYaml
      responses:
        200:
          description: The namespace as OSI ontology YAML
          content:
            application/yaml:
              schema:
                type: string
        404:
          $ref: "#/components/responses/NotFound"
          description: Namespace not found
    put:
      tags:
        - Semantics
      summary: Replace a namespace from OSI ontology YAML
      description: >-
        EXPERIMENTAL Applies a whole OSI ontology YAML document as the complete state of the
        namespace, writing its concepts and relationships in dependency order (groups before members,
        concepts before relationships). This REPLACES rather than merges: any concept or relationship
        the namespace holds that the document does not mention is deleted, so a GET–edit–PUT cycle
        can remove things. Always send the full document; use the per-concept endpoints to change a
        single concept. The namespace is created if it does not exist yet, from the metadata in the
        document's root `custom_properties` (`display_name`, `read_only`, `owner`) and the root
        `description`. That namespace metadata still merges — keys the document omits leave stored
        values unchanged, so applying a plain OSI document does not clear a namespace's
        configuration. Changing `owner` requires edit permission on both the current and the new
        owning team. Concept names must be unique within the namespace, since the document references
        concepts by name; groups are exempt.
      operationId: putSemanticOntologyYaml
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
      responses:
        200:
          description: The namespace now matches the document
        403:
          $ref: "#/components/responses/Forbidden"
          description: Insufficient permission on the current or the requested owning team
        422:
          $ref: "#/components/responses/UnprocessableContent"
          description: The YAML is invalid, two concepts share a name, or the requested owning team does not exist
  /api/semantics/experimental/namespaces/{namespace}/gitconnection:
    parameters:
      - name: namespace
        in: path
        description: The namespace identifier.
        required: true
        example: main
        schema:
          type: string
    get:
      tags:
        - Semantics
      summary: Get the git connection of a semantic namespace
      description: >-
        EXPERIMENTAL Returns the git connection details including sync status and web link. The
        connected file holds the namespace's OSI ontology document — the same one
        `GET .../ontology.yaml` returns. Sync status accounts for changes to the concepts and
        relationships in the namespace, not only to the namespace's own metadata.
      operationId: getSemanticNamespaceGitConnection
      responses:
        200:
          description: Git connection details
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/GitConnectionResponse'
        404:
          $ref: "#/components/responses/NotFound"
          description: Namespace or git connection not found
    put:
      tags:
        - Semantics
      summary: Create or update a git connection for a semantic namespace
      description: >-
        EXPERIMENTAL Creates or updates the git connection for a semantic namespace. Credentials are
        resolved either explicitly via `gitCredentialExternalId` or implicitly via
        `gitConnectionType`/`host` matching through the credential hierarchy. The namespace must
        already exist and be owned before it can be connected: a pull has no user behind it, so git
        can neither create a namespace nor change who owns one.
      operationId: putSemanticNamespaceGitConnection
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/GitConnectionRequest'
      responses:
        200:
          description: Git connection created or updated
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/GitConnectionResponse'
        400:
          $ref: "#/components/responses/BadRequest"
          description: Repository URL cannot be used with the git provider
        404:
          $ref: "#/components/responses/NotFound"
          description: Namespace, or credential with the specified `gitCredentialExternalId`, not found
        409:
          $ref: "#/components/responses/Conflict"
          description: File is already connected to another resource
        422:
          $ref: "#/components/responses/UnprocessableContent"
          description: No git credentials found
    delete:
      tags:
        - Semantics
      summary: Delete the git connection of a semantic namespace
      description: >-
        EXPERIMENTAL Removes the git connection. The namespace and its concepts are not affected.
      operationId: deleteSemanticNamespaceGitConnection
      responses:
        200:
          description: Git connection deleted
        404:
          $ref: "#/components/responses/NotFound"
          description: Namespace not found
  /api/semantics/experimental/namespaces/{namespace}/gitconnection/pull:
    parameters:
      - name: namespace
        in: path
        description: The namespace identifier.
        required: true
        example: main
        schema:
          type: string
    post:
      tags:
        - Semantics
      summary: Pull a semantic namespace from Git
      description: >-
        EXPERIMENTAL Fetches the ontology document from the Git repository and applies it as the
        complete state of the namespace, exactly as `PUT .../ontology.yaml` does: concepts and
        relationships the document does not mention are deleted. The namespace's `owner` is not
        taken from the document — ownership is changed through the UI or the namespace API, never by
        a pull.
      operationId: pullSemanticNamespaceFromGit
      responses:
        200:
          description: Namespace updated from Git
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/GitConnectionResponse'
        404:
          $ref: "#/components/responses/NotFound"
          description: Namespace or git connection not found
        422:
          $ref: "#/components/responses/UnprocessableContent"
          description: Git setting not found, uses user-level auth, or the document is not a valid ontology
        502:
          $ref: "#/components/responses/BadGateway"
          description: Error communicating with the Git provider
  /api/semantics/experimental/namespaces/{namespace}/gitconnection/push:
    parameters:
      - name: namespace
        in: path
        description: The namespace identifier.
        required: true
        example: main
        schema:
          type: string
    post:
      tags:
        - Semantics
      summary: Push a semantic namespace to Git
      description: >-
        EXPERIMENTAL Pushes the namespace's current OSI ontology document to the connected Git
        repository.
      operationId: pushSemanticNamespaceToGit
      requestBody:
        required: false
        content:
          'application/json':
            schema:
