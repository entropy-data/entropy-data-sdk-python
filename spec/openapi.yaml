    put:
      tags:
        - "Integrations: Ingest"
      summary: Create or update an asset import
      description: |
        Create an asset import, or change an existing one. `configuration` is the provider's configuration as the
        `GET` returns it: `source`, `name`, `scheduleExpression`, `description`, `filters` and
        `assetOwnerTeamExternalId`; the id is the path's, and the source of an existing import cannot change.
