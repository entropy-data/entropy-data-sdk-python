        422:
          $ref: "#/components/responses/UnprocessableContent"
          description: Git setting not found, uses user-level auth, or the namespace has no content
        502:
          $ref: "#/components/responses/BadGateway"
          description: Error communicating with the Git provider
  /api/semantics/experimental/namespaces/{namespace}/gitconnection/push-pr:
    parameters:
      - name: namespace
        in: path
        description: The namespace identifier.
        required: true
        example: main
        schema:
          type: string
    post:
      tags:
        - Semantics
      summary: Push a semantic namespace to Git as a pull request
      description: >-
        EXPERIMENTAL Creates a new branch, commits the namespace's OSI ontology document, and opens a
