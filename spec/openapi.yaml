        schema:
          type: string
    get:
      tags:
        - "Integrations: Unity Catalog Metadata"
      summary: Get a Unity Catalog metadata integration
      description: >-
        The integration with its credential (secret excluded) and its `status` — the tables it wrote, the events
        that wait, and its task.
      operationId: getUnityCatalogMetadataIntegration
      responses:
        200:
          description: The integration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnityCatalogMetadataIntegration'
        404:
          $ref: "#/components/responses/NotFound"
          description: Integration not found, or the API key cannot see it.
    put:
      tags:
        - "Integrations: Unity Catalog Metadata"
      summary: Create or update a Unity Catalog metadata integration
      description: |
        Create the integration, or change the name, the credential and the enabled state of an existing one. The
        credential is required on create; omit it on update to keep the stored credential.

        Requires `INGESTION_EDIT` with organization-wide authority (an organization key, or a user key whose
        user holds the permission).
      operationId: putUnityCatalogMetadataIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnityCatalogMetadataIntegrationRequest'
      responses:
        200:
          description: The integration was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnityCatalogMetadataIntegration'
        201:
          description: The integration was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnityCatalogMetadataIntegration'
        400:
          $ref: "#/components/responses/BadRequest"
          description: The name is missing, or the credential is incomplete or missing on create.
        403:
          $ref: "#/components/responses/Forbidden"
        409:
          description: Another integration, such as an asset import, has this id.
    delete:
      tags:
        - "Integrations: Unity Catalog Metadata"
      summary: Delete a Unity Catalog metadata integration
      description: |
        Delete the integration together with its waiting events, its written-table records, and its task.
        Metadata that was written to Unity Catalog stays as it is. Requires `INGESTION_EDIT` with
        organization-wide authority.
      operationId: deleteUnityCatalogMetadataIntegration
      responses:
        204:
          description: The integration was deleted.
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
  /api/integrations/unity-catalog-metadata/{integration}/tables:
    parameters:
      - name: integration
        in: path
        description: The identifier of the integration.
        required: true
        schema:
          type: string
    get:
      tags:
        - "Integrations: Unity Catalog Metadata"
      summary: List the tables the integration wrote
      description: >-
        One entry for each Unity Catalog table that a data contract of the organization names in the
        integration's workspace, with the state of the last write.
      operationId: listUnityCatalogMetadataTables
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [in_sync, unresolved, failed]
          required: false
          description: Filter to tables in a specific state.
      responses:
        200:
          description: The tables, ordered by data contract and element.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnityCatalogMetadataTable'
        404:
          $ref: "#/components/responses/NotFound"
  /api/integrations/unity-catalog-metadata/{integration}/queue:
    parameters:
      - name: integration
        in: path
        description: The identifier of the integration.
        required: true
        schema:
          type: string
    get:
      tags:
        - "Integrations: Unity Catalog Metadata"
      summary: List the queue of the integration
      description: >-
        The changes the integration has not written yet, oldest first: which application event, for which
        data contract or concept, how often it was tried and what went wrong.
      operationId: listUnityCatalogMetadataQueue
      responses:
        200:
          description: The queue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnityCatalogMetadataQueueEntry'
        404:
          $ref: "#/components/responses/NotFound"
  /api/integrations/unity-catalog-metadata/{integration}/tables/retry-failed:
    parameters:
      - name: integration
        in: path
        description: The identifier of the integration.
        required: true
        schema:
          type: string
    post:
      tags:
        - "Integrations: Unity Catalog Metadata"
      summary: Write the failed tables again
      description: >-
        Ask the integration to write every data contract again that has a `failed` or `unresolved` table.
        The write runs on the integration's task shortly after. Requires `INGESTION_EDIT`.
      operationId: retryFailedUnityCatalogMetadataTables
      responses:
        200:
          description: The number of data contracts that are written again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnityCatalogMetadataActionResponse'
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
  /api/integrations/unity-catalog-metadata/{integration}/queue/discard:
    parameters:
      - name: integration
        in: path
        description: The identifier of the integration.
        required: true
        schema:
          type: string
    post:
      tags:
        - "Integrations: Unity Catalog Metadata"
      summary: Discard the queue
      description: >-
        Drop every change that waits for the integration, for example after a long outage of the workspace.
        Later changes are written as usual. Requires `INGESTION_EDIT`.
      operationId: discardUnityCatalogMetadataQueue
      responses:
        200:
          description: The number of queue entries that were discarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnityCatalogMetadataActionResponse'
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
