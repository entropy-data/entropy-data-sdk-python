          example: 2023-01-01T09:15:20.705Z
    AssetUpdatedEvent:
      type: object
      description: An asset was updated.
      required:
        - id
        - timestamp
      properties:
        id:
          type: string
          description: The identifier of the asset.
          example: asset-1
        timestamp:
          type: string
          format: date-time
          description: The business time when the asset was updated
          example: 2023-01-01T09:15:20.705Z
    AssetDeletedEvent:
      type: object
      description: An asset was deleted.
      required:
        - id
        - timestamp
      properties:
        id:
          type: string
          description: The identifier of the asset.
          example: asset-1
        timestamp:
          type: string
          format: date-time
          description: The business time when the asset was deleted
          example: 2023-01-01T09:15:20.705Z
    TestResultsCreatedEvent:
      type: object
      description: A test result was published.
      required:
        - id
        - timestamp
      properties:
        id:
          type: string
          description: The identifier of the test results.
          example: 2f0720d5-e7b2-4b83-90d3-421fda9be54b
        status:
            type: string
            description: The status of the test result.
            example: passed
        timestamp:
          type: string
          format: date-time
          description: The business time when the test result was published
          example: 2023-01-01T09:15:20.705Z
    TestResultsDeletedEvent:
      type: object
      description: Test results have been deleted
      required:
        - id
        - timestamp
      properties:
        id:
          type: string
          description: The identifier of the test results.
          example: 2f0720d5-e7b2-4b83-90d3-421fda9be54b
        timestamp:
          type: string
          format: date-time
          description: The business time when the test result was deleted
          example: 2023-01-01T09:15:20.705Z
    ApiSearchResource:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the resource.
          example: "medical-study-123"
        url:
          type: string
          format: uri
          description: The URL to access the resource.
          example: "https://example.com/datacontracts/medical-study-123"
          nullable: true
        ownerId:
          type: string
          description: Identifier of the owner of the resource.
          nullable: true
        ownerName:
          type: string
          description: Name of the owner of the resource.
          nullable: true
        name:
          type: string
          description: The name of the resource.
          example: "Medical Studies 2023"
        resourceType:
          type: string
          description: |
            The type of the searchable resource.
            Possible values include:
            - DATA_PRODUCT
            - DATA_CONTRACT
            - DATA_ASSET
            - DEFINITION
            - TEAM
            - TAG
          example: DATA_CONTRACT
        description:
          type: string
          description: Additional details about the resource.
          nullable: true
    ScimListResponseUsers:
      allOf:
        - $ref: '#/components/schemas/ScimListResponse'
        - type: object
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/ScimUser'

    ScimListResponseGroups:
      allOf:
        - $ref: '#/components/schemas/ScimListResponse'
        - type: object
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/ScimGroup'

    ScimListResponse:
      type: object
      properties:
        totalResults:
          type: integer
          description: The total number of resources returned by the query.
        itemsPerPage:
          type: integer
          description: The number of resources returned per page.
        startIndex:
          type: integer
          description: The 1-based index of the first resource in the returned page.
        schemas:
          type: array
          items:
            type: string
          default: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
    ScimUser:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          default: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        id:
          type: string
          description: The unique identifier of the user. This is generated by the system.
        externalId:
          type: string
          description: The external identifier of the user.
        userName:
          type: string
          format: email
          description: The user's username. This must be the user's email address.
        displayName:
          type: string
          description: The display name of the user.
        emails:
          type: array
          items:
            $ref: '#/components/schemas/ScimEmail'
        active:
          type: boolean
          description: Indicates if the user is active. A soft-delete is currently not supported.
          default: true
        meta:
          $ref: '#/components/schemas/ScimMeta'
      required:
        - userName
    ScimEmail:
      type: object
      properties:
        value:
          type: string
          format: email
          description: The email address.
        type:
          type: string
          description: The type of email address. This should be "work"
          example: work
        primary:
          type: boolean
          description: Indicates if this is the primary email address.
          default: true
      required:
        - value
    ScimPatchRequest:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          default: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
        operations:
          type: array
          items:
            type: object
            properties:
              op:
                type: string
                description: The operation to perform (add, replace, remove).
                enum: [add, replace, remove]
              path:
                type: string
                description: The path to the property to update.
              value:
                type: object
                description: The value to set for the property.
            required:
              - op
              - path
      required:
        - operations
    ScimGroup:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          default: ["urn:ietf:params:scim:schemas:core:2.0:Group"]
        id:
          type: string
          description: The unique identifier of the group.
        displayName:
          type: string
          description: The display name of the group.
        members:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                description: The member identifier.
              display:
                type: string
                description: The display name of the member.
              type:
                type: string
                description: The type of member (User).
                default: "User"
            required:
              - value
        meta:
          $ref: '#/components/schemas/ScimMeta'
      required:
        - displayName
    ScimMeta:
      type: object
      properties:
        resourceType:
          type: string
          description: The type of the resource.
          default: "User"
        created:
          type: string
          format: date-time
          description: The date and time the resource was created.
        lastModified:
          type: string
          format: date-time
          description: The date and time the resource was last modified.
        location:
          type: string
          description: The location of the resource.
        version:
          type: string
          description: The version of the resource.

    ScimServiceProviderConfig:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          default: ["urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig"]
        documentationUri:
          type: string
          description: A URI pointing to human-readable documentation of the service provider.
        patch:
          $ref: '#/components/schemas/ScimSupportedFeature'
        bulk:
          $ref: '#/components/schemas/ScimSupportedFeature'
        filter:
          $ref: '#/components/schemas/ScimFilterConfig'
        changePassword:
          $ref: '#/components/schemas/ScimSupportedFeature'
        sort:
          $ref: '#/components/schemas/ScimSupportedFeature'
        etag:
          $ref: '#/components/schemas/ScimSupportedFeature'
        authenticationSchemes:
          type: array
          items:
            $ref: '#/components/schemas/ScimAuthenticationScheme'
        meta:
          $ref: '#/components/schemas/ScimMeta'

    ScimSupportedFeature:
      type: object
      properties:
        supported:
          type: boolean
          description: Whether the feature is supported.
          example: false

    ScimFilterConfig:
      type: object
      properties:
        supported:
          type: boolean
          description: Whether filtering is supported.
          example: true
        maxResults:
          type: integer
          description: The maximum number of results the server will return.
          example: 200

    ScimAuthenticationScheme:
      type: object
      properties:
        name:
          type: string
          description: The name of the authentication scheme.
          example: OAuth Bearer Token
        description:
          type: string
          description: A description of the authentication scheme.
          example: Authentication scheme using the OAuth Bearer Token Standard
        specUri:
          type: string
          description: A URI pointing to the specification of this authentication scheme.
          example: https://tools.ietf.org/html/rfc6750
        type:
          type: string
          description: The type of authentication (e.g., oauth, oauth2, oauthbearertoken).
          example: oauthbearertoken
        primary:
          type: boolean
          description: Whether this is the primary authentication scheme.
          example: true

    CopyAccessPreview:
      type: object
      properties:
        outputPortId:
          type: string
          description: The externalId of the output port the access would be copied to.
        sourceOutputPortId:
          type: string
          description: The externalId of the output port the access would be copied from.
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CopyAccessCandidate"
      required:
        - outputPortId
        - sourceOutputPortId
        - candidates
    CopyAccessCandidate:
      type: object
      properties:
        id:
          type: string
          description: The externalId of the access agreement on the source output port.
        consumerType:
          type: string
          enum: [dataproduct, team, user]
        consumerId:
          type: string
          description: The externalId of the consuming data product or team, or the email address of the consuming user.
        purpose:
          type: string
          description: The consumer's own justification, carried over to the copy unchanged.
        startDate:
          type: string
          format: date
          description: The start date on the source agreement. The copy starts today instead.
        endDate:
          type: string
          format: date
          description: Carried over to the copy.
        roles:
          type: array
          items:
            type: string
        rolesNotOnTarget:
          type: array
          description: Roles held on the source that the target's data contract does not define. These are dropped on copy.
          items:
            type: string
        copyable:
          type: boolean
        reason:
          type: string
          description: Why this one cannot be copied.
          enum: [already-has-access, not-allowed-on-target]
      required:
        - consumerType
        - roles
        - rolesNotOnTarget
        - copyable
    CopyAccessResponse:
      type: object
      properties:
        copied:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: The externalId of the newly created access agreement.
              copiedFrom:
                type: string
                description: The externalId of the source access agreement.
            required:
              - id
              - copiedFrom
        skipped:
          type: array
          description: Consumers that were deliberately not copied, for example because they already have access here.
          items:
            $ref: "#/components/schemas/CopyAccessNotCopied"
        failed:
          type: array
          description: Consumers whose copy was attempted and did not succeed.
          items:
            $ref: "#/components/schemas/CopyAccessNotCopied"
      required:
        - copied
        - skipped
        - failed
    CopyAccessNotCopied:
      type: object
      properties:
        id:
          type: string
          description: The externalId of the access agreement on the source output port.
        reason:
          type: string
      required:
        - reason
    ScimResourceType:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          default: ["urn:ietf:params:scim:schemas:core:2.0:ResourceType"]
        id:
          type: string
          description: The ID of the resource type.
          example: User
        name:
          type: string
          description: The name of the resource type.
          example: User
        description:
          type: string
          description: A description of the resource type.
          example: User Account
        endpoint:
          type: string
          description: The endpoint where this resource type can be accessed.
          example: "/Users"
        schema:
          type: string
          description: The schema associated with this resource type.
          example: "urn:ietf:params:scim:schemas:core:2.0:User"
        schemaExtensions:
          type: array
          items:
            $ref: '#/components/schemas/ScimSchemaExtension'
        meta:
          $ref: '#/components/schemas/ScimMeta'

    ScimSchemaExtension:
      type: object
      properties:
        schema:
          type: string
          description: The schema extension URI.
        required:
          type: boolean
          description: Whether this schema extension is required.

    ScimSchema:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          default: ["urn:ietf:params:scim:schemas:core:2.0:Schema"]
        id:
          type: string
          description: The ID of the schema.
        name:
          type: string
          description: The name of the schema.
        description:
          type: string
          description: A description of the schema.
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ScimSchemaAttribute'
        meta:
          $ref: '#/components/schemas/ScimMeta'

    ScimSchemaAttribute:
      type: object
      properties:
        name:
          type: string
          description: The name of the attribute.
          example: userName
        type:
          type: string
          description: The data type of the attribute.
          example: string
        multiValued:
          type: boolean
          description: Whether the attribute can have multiple values.
          example: false
        description:
          type: string
          description: A description of the attribute.
          example: Email address of the user
        required:
          type: boolean
          description: Whether the attribute is required.
          example: true
        caseExact:
          type: boolean
          description: Whether case must be matched exactly.
          example: false
        mutability:
          type: string
          description: The mutability of the attribute (readOnly, readWrite, immutable, writeOnly).
          example: readOnly
        returned:
          type: string
          description: When the attribute is returned (always, never, default, request).
          example: default
        uniqueness:
          type: string
          description: Whether the attribute value must be unique (none, server, global).
          example: server
        subAttributes:
          type: array
          items:
            $ref: '#/components/schemas/ScimSchemaAttribute'
        canonicalValues:
          type: array
          items:
            type: string
          description: A list of canonical values.
        referenceTypes:
          type: array
          items:
            type: string
          description: A list of reference types.

    ScimListResponseResourceTypes:
      allOf:
        - $ref: '#/components/schemas/ScimListResponse'
        - type: object
          properties:
            Resources:
              type: array
              items:
                $ref: '#/components/schemas/ScimResourceType'

    ScimListResponseSchemas:
      allOf:
        - $ref: '#/components/schemas/ScimListResponse'
        - type: object
          properties:
            Resources:
              type: array
              items:
                $ref: '#/components/schemas/ScimSchema'
