  /api/access/{id}/provisioning:
    parameters:
      - name: id
        in: path
        description: An organizational unique technical identifier for this access resource, such as an UUID, URN, string, number. Format must be a valid path parameter for GET and DELETE requests, so no URI or '/' allowed.
        required: true
        schema:
          type: string
    get:
      tags:
        - Access
      summary: Get the provisioning state of an access resource
      description: Returns the provisioning state most recently reported by the external component that creates the grant.
      operationId: getAccessProvisioning
      responses:
        200:
          description: The current provisioning state.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/AccessProvisioning'
        404:
          $ref: "#/components/responses/NotFound"
          description: Access not found, or no provisioning has been reported for it.
    put:
      tags:
        - Access
      summary: Replace the provisioning state of an access resource
      description: |
        Replaces the whole provisioning record. Unlike the transition endpoints, fields absent from
        the payload are cleared — this is for components that reconcile against their platform and
        then declare the resulting state rather than reporting individual transitions.

        A payload whose `status` differs from the stored one emits the same event and writes the same
        audit-trail entry as the equivalent transition endpoint. A payload with an unchanged `status`
        is treated as a metadata correction: no event, no audit-trail entry.
      operationId: putAccessProvisioning
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/AccessProvisioningReport'
      responses:
        200:
          description: The updated provisioning state.
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/AccessProvisioning'
        400:
          description: The status is missing or not one of the known provisioning states.
        404:
          $ref: "#/components/responses/NotFound"
          description: Access not found
  /api/access/evaluation:
    post:
      tags:
        - Access
      summary: Evaluate an access decision
      description: |
        Decides whether a subject may run a query on a data product's output port, following the OpenID
        AuthZEN Authorization API. The subject needs an active access agreement for the output port
        (provisioned where the organization requires it) and, with AI features enabled, the query must fit
        the data contract's terms of use for the stated purpose.

        Called with a user's API key, the key's user is evaluated. With `subject.type` `agent`, the agent
        is evaluated against its own agreements: an agent can evaluate only itself, an API key any agent
        of the teams it can read. Every decision about an agent appears in the agent's activity.
      operationId: evaluateAccess
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              type: object
              required:
                - subject
                - resource
                - action
              properties:
                subject:
                  type: object
                  properties:
                    type:
                      type: string
                      example: agent
                    id:
                      type: string
                      example: churn-risk-scorer
                resource:
                  type: object
                  properties:
                    type:
                      type: string
                      example: data_product
                    id:
                      type: string
                      example: customers
                    properties:
                      type: object
                      properties:
                        outputPortId:
                          type: string
                          example: snowflake_customers_v1
                action:
                  type: object
                  properties:
                    name:
                      type: string
                      example: query
                    properties:
                      type: object
                      properties:
                        sql:
                          type: string
                          example: SELECT customer_id, segment FROM customers
                        purpose:
                          type: string
                          example: nightly churn scoring
      responses:
        200:
          description: The decision
          content:
            'application/json':
              schema:
                type: object
                properties:
                  decision:
                    type: boolean
                  context:
                    type: object
                    properties:
                      reasons:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: NO_ACCESS
                            reason_admin:
                              type: object
                              additionalProperties:
                                type: string
                            reason_user:
                              type: object
                              additionalProperties:
                                type: string
  /api/agent-identities:
