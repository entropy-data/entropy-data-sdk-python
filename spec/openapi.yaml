        length bounds, and `required` of the standard and custom properties of every customized
        section (for example the description, schema objects and their properties at any depth,
        output ports, and team), plus their `title`, `description`, and `placeholder` (as
        `examples`) (language-tagged texts such as `title@de` resolved for the installation's
        default language, since API key requests carry no user language). Equals the base schema when the organization has no schema-relevant
        customization. The served base version is reported in the
        `X-Schema-Version` response header.
      operationId: getOdpsCustomSchema
      responses:
        200:
          $ref: '#/components/responses/JsonSchema'
        403:
          $ref: '#/components/responses/Forbidden'
  /api/schemas/odps-{version}.schema.json:
    get:
      tags:
        - Schemas
      summary: Get an ODPS base schema by version
      description: Get the JSON Schema of a specific ODPS version, without any organization customization.
      operationId: getOdpsBaseSchemaByVersion
      parameters:
        - $ref: '#/components/parameters/SchemaVersion'
      responses:
        200:
          $ref: '#/components/responses/JsonSchema'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
          description: The schema version is not available
  /api/schemas/odps-{version}-custom.schema.json:
    get:
      tags:
        - Schemas
      summary: Get an ODPS schema by version with the organization customization
      description: >-
        Get the JSON Schema of a specific ODPS version, composed with the organization's
        customization overlay via `allOf`. The overlay carries the customized `enum`, `pattern`,
        length bounds, and `required` of the standard and custom properties of every customized
        section (for example the description, schema objects and their properties at any depth,
        output ports, and team), plus their `title`, `description`, and `placeholder` (as
        `examples`) (language-tagged texts such as `title@de` resolved for the installation's
        default language, since API key requests carry no user language). Equals the base schema when the organization has no schema-relevant
        customization.
      operationId: getOdpsCustomSchemaByVersion
      parameters:
        - $ref: '#/components/parameters/SchemaVersion'
      responses:
        200:
          $ref: '#/components/responses/JsonSchema'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
          description: The schema version is not available
  /api/settings/scim-mapping:
    get:
      tags:
        - Organization
      summary: Get SCIM mapping
      description: Get the SCIM group mapping configuration for the organization. Requires an organization-scoped API key.
      operationId: getScimMapping
      responses:
        200:
          description: The SCIM mapping YAML or JSON
          content:
            'application/yaml':
              schema:
                type: string
                description: The SCIM mapping YAML
                example: |
                  scimGroupDefaults:
                    defaultTeamMemberRole: Member
                  scimGroupMappings:
                    - scimGroup: admins
                      type: organizationOwner
                    - scimGroup: data-team
                      type: teamMember
                      teamId: my-team
                    - scimGroup: data-team-leads
                      type: teamMemberRole
                      teamId: my-team
                      teamMemberRole: Owner
            'application/json':
              schema:
                $ref: '#/components/schemas/ScimMappingConfiguration'
        403:
          $ref: "#/components/responses/Forbidden"
          description: API key does not have organization scope
    put:
      tags:
        - Organization
      summary: Update SCIM mapping
      description: Update the SCIM group mapping configuration for the organization. Requires an organization-scoped API key with write permissions.
      operationId: putScimMapping
      requestBody:
        required: true
        content:
          'application/yaml':
            schema:
              type: string
              description: The SCIM mapping YAML
              example: |
                scimGroupDefaults:
                  defaultTeamMemberRole: Member
                scimGroupMappings:
                  - scimGroup: admins
                    type: organizationOwner
                  - scimGroup: data-team
                    type: teamMember
                    teamId: my-team
                  - scimGroup: data-team-leads
                    type: teamMemberRole
                    teamId: my-team
                    teamMemberRole: Owner
          'application/json':
            schema:
              $ref: '#/components/schemas/ScimMappingConfiguration'
      responses:
        200:
          description: SCIM mapping updated
        403:
          $ref: "#/components/responses/Forbidden"
          description: API key does not have organization scope
        422:
          $ref: "#/components/responses/UnprocessableContent"
          description: Invalid YAML format
  /api/settings/email-templates:
    get:
      tags:
        - Organization
      summary: Get email templates
      description: >-
        Returns every email type the organization sends: whether it is enabled, whether it may be
        disabled, the variables its wording may use, and the effective subject and body per
        supported language, each marked as built-in (`customized: false`) or customized by the
        organization. Requires an `organization`- or `organization_read`-scoped API key.
      operationId: getEmailTemplates
      responses:
        200:
          description: The email templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplatesSettings'
        403:
          $ref: "#/components/responses/Forbidden"
    put:
      tags:
        - Organization
      summary: Set email templates
      description: >-
        Makes the request the organization's email template setup, in the same shape `GET`
        returns. Email types and languages not in the request revert to the built-in email, an
        omitted `enabled` means enabled, and wording identical to the built-in one is stored as not
        customized — so a `GET` response written back unchanged customizes nothing, and an empty
        document restores every built-in email. `canBeDisabled`, `variables`, and `customized` are
        read-only and ignored on input.


        Subject and body use `{{variable}}` placeholders and `{{#if variable}}...{{/if}}` blocks
        with the variables listed for the type. Unknown types, languages, or variables, unbalanced
        conditional blocks, and blank subjects or bodies are rejected with 400. The `invitation`
        email carries the invitation link and cannot be disabled. Requires an `organization`-scoped
        API key.
      operationId: putEmailTemplates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplatesSettings'
      responses:
        200:
          description: The resulting email templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplatesSettings'
        400:
          description: Invalid request — unknown email type, language, or variable, unbalanced conditionals, blank subject or body, or disabling the invitation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        403:
          $ref: "#/components/responses/Forbidden"
  /api/settings/dataproduct-types:
    get:
      tags:
        - Organization
      summary: Get data product types
      description: >-
        Returns the organization's data product types in display order, the same list the data product
        types settings page edits. While the organization has not defined its own types, the built-in
        defaults are returned with `builtIn: true`. The Power BI system types (`powerbi-report`,
        `powerbi-semanticmodel`) are always appended at the end. Answers JSON or YAML depending on the
        `Accept` header. Requires an `organization`- or `organization_read`-scoped API key.
      operationId: getDataProductTypes
      responses:
        200:
          description: The data product types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataProductTypes'
            application/yaml:
              schema:
                $ref: '#/components/schemas/DataProductTypes'
        403:
          $ref: "#/components/responses/Forbidden"
    put:
      tags:
        - Organization
      summary: Replace data product types
      description: >-
        Replaces the organization's whole list of data product types, in the same shape `GET` returns,
        as JSON or YAML (`Content-Type: application/yaml`). The order of the list is the display order.
        Types not in the request are removed. `behavior` and `builtIn` are read-only and ignored on
        input; the behavior of a built-in id is fixed, and for any other id it follows `outputPorts`
        (`data-product` with output ports, `data-consumer` without). System types such as the Power BI
        types are ignored in a `PUT`, so a `GET` response can be written back unchanged. Requires an
        `organization`-scoped API key with the `ORGANIZATION_ADMIN` permission.
      operationId: putDataProductTypes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataProductTypes'
          application/yaml:
            schema:
              $ref: '#/components/schemas/DataProductTypes'
      responses:
        200:
          description: The data product types were replaced
        403:
          $ref: "#/components/responses/Forbidden"
        422:
          description: >-
            Invalid list — unparsable YAML, a duplicate id, an id not matching `[a-z0-9][a-z0-9-]{0,63}`,
            a custom type without a label, no enabled type, more than one default type, or changing
            `outputPorts` of a type data products already use
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/integrations:
    get:
