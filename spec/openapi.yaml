      operationId: pushSemanticNamespaceToGitAsPullRequest
      requestBody:
        required: false
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/GitPullRequestRequest'
      responses:
        200:
          description: Pull request created
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/GitConnectionResponse'
        404:
          $ref: "#/components/responses/NotFound"
          description: Namespace or git connection not found
        422:
          $ref: "#/components/responses/UnprocessableContent"
          description: Git setting not found or uses user-level auth
        502:
          $ref: "#/components/responses/BadGateway"
          description: Error communicating with the Git provider
