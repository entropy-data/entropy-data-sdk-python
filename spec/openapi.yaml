  /api/datacontracts/{id}/branches:
    parameters:
      - name: id
        in: path
        description: The data contract the branches were cut from.
        required: true
        example: orders_v1
        schema:
          type: string
    get:
      tags:
        - Data Contracts
      summary: List branches
      description: List the branches cut from a data contract.
      operationId: listDataContractBranches
      responses:
        200:
          description: List of branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataContractBranch'
        404:
          $ref: "#/components/responses/NotFound"
          description: Data contract not found
  /api/datacontracts/{id}/branches/{branch}:
    parameters:
      - name: id
        in: path
        description: The data contract the branch was cut from.
        required: true
        example: orders_v1
        schema:
          type: string
      - name: branch
        in: path
        description: The branch name, as typed. Follows git's rules for a branch name; `main` is taken by the data contract itself.
        required: true
        example: add-order-status
        schema:
          type: string
    get:
      tags:
        - Data Contracts
      summary: Get a branch
      description: Get a single branch, including whether the data contract has moved since the branch was last updated from it, and its pull/merge request while one is open.
      operationId: getDataContractBranch
      responses:
        200:
          description: The branch exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContractBranch'
        404:
          $ref: "#/components/responses/NotFound"
          description: Branch not found
    put:
      tags:
        - Data Contracts
      summary: Create a branch
      description: |
        Cut a branch from an ODCS data contract: a hidden copy of it, where changes are authored before
        they land. Cutting the same name twice returns the existing branch.

        This is the first step of the same flow the UI offers — branch, author, merge:

        1. `PUT …/branches/{branch}` cuts the branch.
        2. Author on it through its document: `GET …/branches/{branch}/datacontract.yaml`, edit,
           `PUT` it back. Read what changed with `GET …/branches/{branch}/changes`.
        3. `POST …/branches/{branch}/merge` lands it on the data contract and deletes the branch.

        A branch lands in place, so it can only carry a minor or a patch change: the version it lands
        with must be above the data contract's within the same major. A breaking change is a new data
        contract, not a branch.

        The branch is stored under a hidden id, reported as `branch_data_contract_id`; the data contract
        endpoints do not accept that id, a branch is read and written here. Where the data contract is
        connected to git, the branch is mirrored as `entropy-data/<id>/<branch>` and pushed on every change.
      operationId: putDataContractBranch
      responses:
        200:
          description: Branch created, or already existed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContractBranch'
        404:
          $ref: "#/components/responses/NotFound"
          description: Data contract not found
        422:
          $ref: "#/components/responses/UnprocessableContent"
          description: The name is not a valid branch name, or the data contract is not an ODCS data contract or itself a branch.
    delete:
      tags:
        - Data Contracts
      summary: Delete a branch
      description: Delete a branch and everything authored on it, its test results and the mirrored git branch with it. Only whoever cut the branch, or someone who could merge it, may delete it. The data contract is untouched.
      operationId: deleteDataContractBranch
      responses:
        204:
          description: Branch was deleted (or did not exist)
        403:
          description: The caller neither cut the branch nor may merge into the data contract.
  /api/datacontracts/{id}/branches/{branch}/rebase:
    parameters:
      - name: id
        in: path
        required: true
        example: orders_v1
        schema:
          type: string
      - name: branch
        in: path
        required: true
        example: add-order-status
        schema:
          type: string
    post:
      tags:
        - Data Contracts
      summary: Update a branch from its data contract
      description: |
        Replay the branch's changes onto the data contract as it now stands, the way "Update from main"
        does in the UI. An element the branch did not touch takes the data contract's version, an element
        only the branch touched is left alone, and where both sides changed the same element nothing is
        written: the disagreement is reported in `conflicts` and the branch stays conflicted until its
        author resolves it in the UI. `behind_target` says whether there is anything to update from.
      operationId: rebaseDataContractBranch
      responses:
        200:
          description: The branch was replayed; check `conflicts`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContractBranch'
        404:
          $ref: "#/components/responses/NotFound"
          description: Branch not found
  /api/datacontracts/{id}/branches/{branch}/datacontract.yaml:
    parameters:
      - name: id
        in: path
        required: true
        example: orders_v1
        schema:
          type: string
      - name: branch
        in: path
        required: true
        example: add-order-status
        schema:
          type: string
    get:
      tags:
        - Data Contracts
      summary: Get a branch as YAML
      description: The branch's document, as the author wrote it, under the data contract's id.
      operationId: getDataContractBranchYaml
      responses:
        200:
          description: The branch as ODCS YAML
          content:
            application/yaml:
              schema:
                type: string
        404:
          $ref: "#/components/responses/NotFound"
          description: Branch not found
    put:
      tags:
        - Data Contracts
      summary: Replace a branch from YAML
      description: Replace the branch's document. The data contract it was cut from does not change until the branch is merged; the document keeps the data contract's id whatever it says. Writing a branch takes the permission to edit or to propose changes on the data contract's owning team. Where the data contract is connected to git, the branch's git branch is pushed afterwards.
      operationId: putDataContractBranchYaml
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
      responses:
        200:
          description: The branch now holds the document
        403:
          $ref: "#/components/responses/Forbidden"
          description: No permission to propose on the data contract
        404:
          $ref: "#/components/responses/NotFound"
          description: Branch not found
        422:
          description: The document is not valid YAML, not an ODCS document, or breaks the organization's customization rules
  /api/datacontracts/{id}/branches/{branch}/changes:
    parameters:
      - name: id
        in: path
        required: true
        example: orders_v1
        schema:
          type: string
      - name: branch
        in: path
        required: true
        example: add-order-status
        schema:
          type: string
    get:
      tags:
        - Data Contracts
      summary: List a branch's changes
      description: What the branch changes against its data contract, one entry per changed element (a schema object, a property, a server, a role, an SLA entry, a custom property, a root field).
      operationId: listDataContractBranchChanges
      responses:
        200:
          description: The changes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataContractBranchChange'
        404:
          $ref: "#/components/responses/NotFound"
          description: Branch not found
  /api/datacontracts/{id}/branches/{branch}/merge:
    parameters:
      - name: id
        in: path
        required: true
        example: orders_v1
        schema:
          type: string
      - name: branch
        in: path
        required: true
        example: add-order-status
        schema:
          type: string
    post:
      tags:
        - Data Contracts
      summary: Merge a branch
      description: |
        Land the branch on its data contract and delete it — or hand it to git for review.

        The data contract takes the branch's document, less its id, and the branch is deleted
        afterwards, the mirrored git branch with it; what landed reaches the data contract's own git
        branch through its auto-push setting. The branch is first replayed onto the data contract as
        it stands; if the two disagree, `409` is answered, the branch is marked `conflicted`, and the
        author resolves it in the UI before trying again.

        The version the data contract lands with must be above its current version within the same
        major. When the branch's own version is not (`version_state` is `needsBump`), pass the version
        to land with in the body; `majorDiffers` cannot be merged at all.

        Where the data contract is connected to git and its branch only takes reviewed changes — the
        branch is protected, or the connection's auto-push mode is `push_to_pr` — nothing lands here.
        Instead a pull/merge request is opened from the branch's git mirror and returned with `200`.
        The branch stays open and keeps mirroring edits onto the request's head branch; once the
        provider reports the request merged or closed, the branch is removed here and the merged
        document reaches the data contract through its pull from git.

        Where the git branch takes direct changes, `route` picks between the two: `land` (the
        default) or `pull_request`, which opens the request all the same. Asking to land where the
        git branch takes reviewed changes only, or for a request where the data contract is not
        connected to git, is answered with `422`.

        Merging takes what editing the data contract takes: edit permission on its owning team, or
        the organization owner role.
      operationId: mergeDataContractBranch
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
                  description: The version the data contract lands with, when the branch's own version is not above the data contract's. Above the data contract's version within the same major, or the data contract's own version to keep it.
                  example: 1.1.0
                update_port_versions:
                  type: boolean
                  default: false
                  description: Whether the output ports implementing the data contract take the landed version, as ODPS defines a port's `version` to be the version of the contract it serves. Off unless asked, since the ports belong to other data products.
                route:
                  type: string
                  enum: [land, pull_request]
                  description: How the branch reaches the data contract. Absent takes the route the data contract's git branch requires; `pull_request` opens a pull/merge request even where landing would be allowed.
      responses:
        204:
          description: The branch landed on the data contract and was deleted
        200:
          description: A pull/merge request was opened from the branch's mirror and the branch stays open, because the data contract's git branch takes reviewed changes only or the body asked for it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticBranchMergeRequest'
        403:
          $ref: "#/components/responses/Forbidden"
          description: No permission to edit the data contract
        404:
          $ref: "#/components/responses/NotFound"
          description: Branch not found
        409:
          description: The branch conflicts with the data contract, or has no changes to merge
        422:
          description: The branch's version cannot land — it is not above the data contract's, or changes the major version — or its document is not valid; or the `route` asked for is not open to this data contract
  /api/datacontracts/{id}/branches/{branch}/test-results:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: orders_v1
      - name: branch
        in: path
        required: true
        schema:
          type: string
        example: add-order-status
    get:
      tags:
        - Data Contracts
      summary: List the test results of a branch
      description: The runs made against this branch, newest first, ten per page by default (`p`, `size`). A branch's runs are the branch's alone; they never appear in the data contract's own results and are deleted with the branch.
      operationId: getDataContractBranchTestResults
      parameters:
        - in: query
          name: server
          schema:
            type: string
          required: false
          example: production
          description: Filter by the server the tests ran against, as named in the test results.
        - in: query
          name: from
          schema:
            type: string
          required: false
          example: 2026-10-01T00:00:00Z
          description: Only runs that started at or after this instant (inclusive). An ISO-8601 date-time with offset, or a date, meaning that day's start in UTC.
        - in: query
          name: to
          schema:
            type: string
          required: false
          example: 2026-10-08
          description: Only runs that started before this instant (exclusive). Same format as `from`.
        - in: query
          name: p
          schema:
            type: integer
            minimum: 0
          required: false
          example: 0
          description: The number of the requested page, starting from 0. Use the Link header with rel="next" to navigate to the next page.
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          required: false
          example: 10
          description: The maximum number of test results per page (default 10, at most 1000).
      responses:
        200:
          description: The branch's test results.
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestResults'
        404:
          description: The data contract or the branch does not exist.
    post:
      tags:
        - Data Contracts
      summary: Add test results of a datacontract CLI run against a branch
      description: "The same payload `POST /api/test-results` takes, with the branch named by the URL rather than a `branch` field, so a `datacontract test --publish <this URL>` run reaches the branch. The payload's `dataContractId` must be the data contract in the URL, and its `branch`, if given, the branch in the URL."
      operationId: postDataContractBranchTestResults
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/TestResults'
      responses:
        200:
          description: Test results successfully added to the branch.
        422:
          description: The payload names another data contract or branch, or the branch does not exist.
  /api/datacontracts/{id}/branches/{branch}/test:
