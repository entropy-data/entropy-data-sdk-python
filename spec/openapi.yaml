                - dataProductId
            - type: object
              properties:
                teamId:
                  type: string
                  example: marketing-team
              required:
                - teamId
            - type: object
              properties:
                userId:
                  type: string
                  example: user-123
              required:
                - userId
            - type: object
              description: |
                An agent identity. Only the agent gets access, not the members of its owning team. On an
                agent consumer, dataProductId and teamId are not set, so a provisioning integration that
                doesn't know agents finds no principal instead of granting the agent's team.
              properties:
                agentId:
                  type: string
                  example: churn-risk-scorer
              required:
                - agentId
        provisioning:
          allOf:
            - $ref: '#/components/schemas/AccessProvisioning'
          description: |
            The provisioning state reported by the external component that creates the grant.
            Absent until something has been reported. Read-only: write it through the
            /api/access/{id}/provisioning endpoints; anything sent here on a PUT is ignored.
          readOnly: true
        tags:
          type: array
          description: Tags are used to categorize data usage agreements.
          items:
            type: string
            example: business-critical
          example: [ "business-critical", "marketing" ]
        links:
          type: object
          description: Links are used to reference external resources, such as schemas or the dataset in a data catalog.
          additionalProperties: {
            type: string
          }
          example: {
            schema: "https://catalog.example.com/search/search-queries",
            catalog: "https://catalog.example.com/search/search-queries/"
          }
        custom:
          type: object
          description: Custom fields can be used to add additional information to the data usage agreement.
          additionalProperties: {
            type: string
          }
    Certification:
      type: object
      description: A certification defines a quality level that can be assigned to data products.
      required:
        - id
        - name
        - tag
      properties:
        id:
          type: string
          format: uuid
          description: The UUID of the certification. Must be same as the path parameter.
        name:
          type: string
          description: The display name of the certification
          example: Gold
        rank:
          type: integer
          description: The rank of the certification, used for ordering
          example: 1
        description:
          type: string
          description: A description of the certification
          example: Gold certified data product
        criteria:
          type: string
          description: The criteria for achieving this certification
          example: Must pass all quality checks
        tag:
          type: string
          description: The external ID of the tag associated with this certification
          example: certification-gold
        icon:
          type: string
          description: The icon for the certification
          example: star
        restricted:
          type: boolean
          description: Whether this certification can only be assigned by governance
          example: false
    Policy:
      type: object
      description: |
        EXPERIMENTAL — a policy is a rule of play of the data mesh. Shape may change without backwards-compatibility guarantees while the API stabilizes.
      required:
        - name
      properties:
        id:
          type: string
          description: The external ID of the policy. Server-assigned in the form `GLOBAL-{n}` and must match the path parameter on PUT.
          example: GLOBAL-1
        name:
          type: string
          description: The display name of the policy
          example: Data Quality
        status:
          type: string
          description: The lifecycle status of the policy
          enum:
            - Draft
            - Accepted
            - Rejected
            - Deprecated
          example: Draft
        content:
          type: string
          description: The body of the policy, formatted as Markdown
          example: All data products must have data quality checks.
    DataProductBuilder:
      type: object
      description: |
        EXPERIMENTAL — a data product builder is a coding agent plugin offered to data product teams on the Build page of matching data products. Shape may change without backwards-compatibility guarantees while the API stabilizes.
      required:
        - name
      properties:
        id:
          type: string
          description: The external id of the builder, unique within the organization. Must match the path parameter on PUT when given.
          example: dbt
        name:
          type: string
          example: dbt Builder
        description:
          type: string
        pluginRepository:
          type: string
          description: Git repository of the coding agent plugin.
          example: https://github.com/example/dbt-builder
        supportedAgents:
          type: array
          description: Coding agents the plugin can be installed into.
          items:
            type: string
            enum:
              - claude_code
              - openai_codex
              - github_copilot_cli
        capabilities:
          type: string
          description: What the builder can do, formatted as Markdown.
        usageInstructions:
          type: string
          description: How to use the builder, formatted as Markdown. May use the placeholders `{{dataProductName}}`, `{{dataProductId}}` and `{{dataProductUrl}}`.
        usageInstructionsByStatus:
          type: array
          description: Usage instructions that replace `usageInstructions` for data products in one of the listed statuses. The first matching rule wins.
          items:
            type: object
            required:
              - statuses
              - instructions
            properties:
              statuses:
                type: array
                items:
                  type: string
                example: [active]
              instructions:
                type: string
        types:
          type: array
          description: Data product type ids the builder applies to. Empty applies to all types.
          items:
            type: string
          example: [source-aligned]
        teams:
          type: array
          description: External ids of the teams the builder applies to, including their sub-teams. Empty applies to all teams.
          items:
            type: string
        tags:
          type: array
          description: Tags the builder applies to; a data product needs at least one of them. Empty applies to all.
          items:
            type: string
        serverTypes:
          type: array
          description: Server types the builder applies to, e.g. `snowflake`. Empty applies to all.
          items:
            type: string
    SourceSystem:
      type: object
      description: A source system is typically an operational system that records business transactions (OLTP).
      required:
        - id
        - name
        - owner
      properties:
        id:
          type: string
          description: An organizational unique technical identifier for this source system. Must be same as the path parameter.
          example: stock-service
        name:
          type: string
          description: The display name of this source system
          example: Stock Service
        owner:
          type: string
          description: The technical id of the team that owns the source system.
          example: fulfillment
        description:
          type: string
          description: A description of the source system
          example: This is the stock service
        tags:
          type: array
          description: List of tags
          items:
            type: string
            example: "dev"
          example: [ "dev", "marketing" ]
        links:
          type: object
          description: Links are used to reference external resources. You can add any links.
          additionalProperties: {
            type: string
          }
          example: {
            homepage: "https://example.com/teams/checkout"
          }
        custom:
          type: object
          description: Custom fields can be used to add additional information to the source system.
          additionalProperties: {
            type: string
          }
          example: {
            "slack-channel": "checkout-public"
          }
    AgentIdentity:
      type: object
      description: |
        A non-human principal owned by one team, such as an AI agent that runs without a person signed
        in. It signs in with its own API keys, may change what its permissions allow on its owning team
        and that team's subteams, and can be the consumer of access agreements.
      required:
        - id
        - name
        - owner
        - purpose
      properties:
        id:
          type: string
          example: churn-risk-scorer
        name:
          type: string
          example: Churn Risk Scorer
        owner:
          type: string
          description: The id of the owning team.
          example: sales-team
        description:
          type: string
          example: Scores active customers for churn risk every night.
        purpose:
          type: string
          description: What the agent does with data. Pre-fills access requests and is checked against data contract terms of use.
          example: Predict churn risk for active B2B customers so account managers can prioritize retention calls.
        status:
          type: string
          enum:
            - active
            - disabled
          default: active
          description: A disabled agent keeps its record, keys and agreements, but its keys don't work.
        permissions:
          type: array
          description: Team permission names the agent may exercise. An empty list means read only. Defaults to ACCESS_REQUEST on create.
          items:
            type: string
          example: [ "ACCESS_REQUEST", "ACCESS_TERMINATE" ]
        linkedIdentities:
          type: array
          description: The same agent in other systems, used to grant access in the data platform.
          items:
            type: object
            required:
              - type
              - id
            properties:
              type:
                type: string
                example: snowflake-user
                description: entra-agent-id, okta, snowflake-user, databricks-service-principal, gcp-service-account, aws-iam-role, spiffe-id, or other
              id:
                type: string
                example: SVC_CHURN_SCORER
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: string
          readOnly: true
    AgentApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: nightly-run
        key:
          type: string
          description: The key itself. Present only in the response that creates it.
        keyHint:
          type: string
          description: The last characters of the key.
          example: 71Kq
        expiresAt:
          type: string
          format: date-time
        lastUsed:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
    AgentOAuthClient:
      type: object
      properties:
        clientId:
          type: string
          example: agent_6c1f0e4b2d8a4f7e9b3c5a1d2e4f6a8b
        clientSecret:
          type: string
          description: Present only in the response that creates the client.
        displayName:
          type: string
          example: scheduler
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
    AgentConnection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: postgres
        name:
          type: string
          example: Warehouse service user
        createdAt:
          type: string
          format: date-time
    AgentConnectionRequest:
      type: object
      required:
        - type
        - name
      description: |
        Fields by type. postgres: host, port, database, user, password. mysql, mariadb, mssql: host, port,
        user, password. exasol: host, port, user, password, certificateFingerprint. trino: serverUrl,
        catalog, schema, username, password. databricks: jdbcUrl, catalogPattern, personalAccessToken.
        snowflake: account, pat, role, warehouse.
      properties:
        type:
          type: string
          enum:
            - postgres
            - mysql
            - mariadb
            - mssql
            - exasol
            - trino
            - databricks
            - snowflake
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        database:
          type: string
        user:
          type: string
        username:
          type: string
        password:
          type: string
        certificateFingerprint:
          type: string
        serverUrl:
          type: string
        catalog:
          type: string
        schema:
          type: string
        jdbcUrl:
          type: string
        catalogPattern:
          type: string
        personalAccessToken:
          type: string
        account:
          type: string
        pat:
          type: string
        role:
          type: string
        warehouse:
          type: string
    AgentTokenIssuer:
      type: object
      required:
        - id
        - issuer
        - linkedIdentityType
      properties:
        id:
          type: string
          example: entra
        issuer:
          type: string
          description: The token's iss claim. Signing keys are discovered from the issuer's OpenID configuration unless jwksUri is set.
          example: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
        jwksUri:
          type: string
          description: Optional signing key set location, if the issuer publishes no OpenID configuration.
        audience:
          type: string
          description: Required value of the aud claim. Tokens for other audiences are rejected.
          example: api://entropy-data
        claim:
          type: string
          default: sub
          description: The claim that identifies the agent, for example oid, azp or sub.
          example: oid
        linkedIdentityType:
          type: string
          description: The type of the agents' linked identity the claim value must match.
          example: entra-agent-id
    Team:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          description: An organizational unique technical identifier for this domain or team. Must be same as the path parameter.
          example: marketing
        name:
          type: string
          description: The display name of this team
          example: Marketing
        parent:
          type: string
          description: The ID of a parent "team" (can be a team of type "Domain"). Can be used to model an organizational hierarchy.
          example: finance
        type:
          type: string
          description: The type of the team. Only a "Team" can own data products, source systems, data contracts, and definitions.
          enum:
            - Domain
            - Team
            - Domain Team
            - Enabling Team
            - Platform Team
            - Governance Group
          example: Team
        description:
          type: string
          description: A description of the team and its responsibilities. If the team is a domain team, it should describe the domain and its boundaries as well.
          example: This is the marketing team
        members:
          type: array
          description: List of team members
          items:
            type: object
            properties:
              emailAddress:
                type: string
                description: E-Mail address of a member
                example: alice@example.com
              role:
                type: string
                description: The team members role. See the [roles documentation](https://docs.entropy-data.com/roles) for available roles. Custom roles can also be used.
                example: Owner
        tags:
          type: array
          description: List of tags
          items:
            type: string
            example: "dev"
          example: [ "dev", "marketing" ]
        links:
          type: object
          description: Links are used to reference external resources. You can add any links.
          additionalProperties: {
            type: string
          }
          example: {
            homepage: "https://example.com/teams/checkout"
          }
        custom:
          type: object
          description: Custom fields can be used to add additional information to the team.
          additionalProperties: {
            type: string
          }
          example: {
            "slack-channel": "checkout-public"
          }
    NotificationChannel:
      type: object
      required:
        - id
        - name
        - type
        - endpoint
        - enabled
      properties:
        id:
          type: string
          description: An organizational unique technical identifier for this notification channel. Must be same as the path parameter.
          example: slack-alerts
        name:
          type: string
          description: The display name of this notification channel
          example: "Slack Alerts"
        type:
          type: string
          description: The type of notification channel
          enum: ["slack", "teams", "googlechat"]
          example: "slack"
        endpoint:
          type: string
          format: uri
          description: The webhook endpoint URL for the notification channel
          example: "https://hooks.slack.com/services/T123/B456/xyz"
        enabled:
          type: boolean
          description: Whether the notification channel is enabled
          example: true
    GitCredentialCreateRequest:
      type: object
      required:
        - gitConnectionType
        - authenticationToken
      properties:
        gitConnectionType:
          type: string
          description: The type of git provider
          enum: ["github", "gitlab", "bitbucket", "azuredevops"]
          example: github
        authenticationToken:
          type: string
          description: The authentication token (e.g., personal access token)
          example: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        externalId:
          type: string
          description: An optional organization-unique identifier for this credential. Set this if you want to reference the credential explicitly via `gitCredentialExternalId` when creating git connections; a credential without an `externalId` can only be resolved implicitly by `gitConnectionType`/`host`, and there is no other way to address it explicitly (the credential `id` and `tokenName` are not accepted). Must be unique across all credential scopes (organization, team, user) within the organization.
          example: my-github-ci
        host:
          type: string
          description: The git host URL
          example: github.com
        tokenName:
          type: string
          description: A display name for the token
          example: My GitHub PAT
        tokenType:
          type: string
          description: |
            The authentication method used for the token. Defaults to `authenticationToken` if not provided.
            - `authenticationToken` — A Personal Access Token (PAT), OAuth token, or Bitbucket Cloud repository/project/workspace Access Token, sent as a Bearer. No username is required. Use this for GitHub, GitLab, Azure DevOps, and Bitbucket Access Tokens.
            - `apiToken` — Basic authentication for Bitbucket Cloud, used with an Atlassian API token (recommended; username is the Atlassian account email) or with a Bitbucket App Password (deprecated by Atlassian; username is the workspace username). When using this type, the `username` field is required.
          enum: ["authenticationToken", "apiToken"]
          example: authenticationToken
        username:
          type: string
          description: The username for Basic authentication. Required when `gitConnectionType` is `bitbucket` and `tokenType` is `apiToken`. Use your Atlassian account email when authenticating with an API token, or your Bitbucket workspace username when authenticating with an App Password.
          example: jane.doe@example.com
    GitCredentialUpdateRequest:
      type: object
      required:
        - gitConnectionType
      properties:
        gitConnectionType:
          type: string
          description: The type of git provider
          enum: ["github", "gitlab", "bitbucket", "azuredevops"]
          example: github
        authenticationToken:
          type: string
          description: The authentication token. If omitted or blank, the existing token is preserved.
          example: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        externalId:
          type: string
          description: An optional organization-unique identifier for this credential. Use this endpoint to assign one to a credential that was created without it (for example, one created through the web UI) so it can be referenced explicitly via `gitCredentialExternalId`. Must be unique across all credential scopes (organization, team, user) within the organization.
          example: my-github-ci
        host:
          type: string
          description: The git host URL
          example: github.com
        tokenName:
          type: string
          description: A display name for the token
          example: My GitHub PAT
        tokenType:
          type: string
          description: |
            The authentication method used for the token. Defaults to `authenticationToken` if not provided.
            - `authenticationToken` — A Personal Access Token (PAT), OAuth token, or Bitbucket Cloud repository/project/workspace Access Token, sent as a Bearer. No username is required. Use this for GitHub, GitLab, Azure DevOps, and Bitbucket Access Tokens.
            - `apiToken` — Basic authentication for Bitbucket Cloud, used with an Atlassian API token (recommended; username is the Atlassian account email) or with a Bitbucket App Password (deprecated by Atlassian; username is the workspace username). When using this type, the `username` field is required.
          enum: ["authenticationToken", "apiToken"]
          example: authenticationToken
        username:
          type: string
          description: The username for Basic authentication. Required when `gitConnectionType` is `bitbucket` and `tokenType` is `apiToken`. Use your Atlassian account email when authenticating with an API token, or your Bitbucket workspace username when authenticating with an App Password.
          example: jane.doe@example.com
    OrganizationSettings:
      type: object
      description: Settings of the organization. The organization UUID is intentionally not exposed.
      properties:
        vanityUrl:
          type: string
          description: The unique vanity URL slug of the organization.
          example: acme
        host:
          type: string
          description: The host (including protocol) the organization is reachable under.
          example: https://acme.entropy-data.com
        fullName:
          type: string
          description: The display name of the organization.
          example: Acme Corp
        logoUrl:
          type: string
          description: URL of the organization logo. Empty string when no logo is configured.
          example: https://example.com/logo.png
        supportEmailAddress:
          type: string
          nullable: true
          description: The support email address shown to organization members.
          example: support@acme.com
        brand:
          type: string
          nullable: true
          description: The product brand the organization is on.
        plan:
          type: string
          nullable: true
          description: The current subscription plan.
          example: enterprise
        sso:
          $ref: '#/components/schemas/OrganizationSsoSettings'
      required:
        - vanityUrl
        - host
        - fullName
        - logoUrl
    OrganizationSsoSettings:
      type: object
      nullable: true
      description: Single sign-on settings. Omitted when SSO is not configured.
      properties:
        issuer:
          type: string
          description: The SSO issuer identifier (e.g. `azuresso`).
        tenant:
          type: string
          nullable: true
          description: The SSO tenant. For Azure SSO this is the Azure tenant; otherwise typically equal to `issuer`.
        autoJoin:
          type: boolean
          nullable: true
          description: Whether new users from this SSO tenant are auto-joined to the organization.
      required:
        - issuer
    GitCredentialResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the git credential
        externalId:
          type: string
          nullable: true
          description: |
            The organization-unique identifier for this credential, or `null` if none was set. It is populated only when an `externalId` was supplied while creating or updating the credential via the API; credentials created through the web UI have no `externalId`.

            This is the only value accepted as `gitCredentialExternalId` when creating a git connection — the credential `id` (UUID) and `tokenName` are not. If this is `null` and you want to address the credential explicitly, assign an `externalId` first via `PUT /api/organization/gitcredentials/{id}` (or the team/user equivalent).
          example: my-github-ci
        gitConnectionType:
          type: string
          description: The type of git provider
          enum: ["github", "gitlab", "bitbucket", "azuredevops"]
          example: github
        host:
          type: string
          description: The git host URL
          example: github.com
        tokenName:
          type: string
          description: A display name for the token
          example: My GitHub PAT
        tokenType:
          type: string
          description: |
            The authentication method used for the token.
            - `authenticationToken` — A Personal Access Token (PAT), OAuth token, or Bitbucket Cloud Access Token sent as a Bearer. No username is required.
            - `apiToken` — Basic authentication for Bitbucket Cloud, used with an Atlassian API token (username is the Atlassian account email) or a Bitbucket App Password (username is the workspace username).
          enum: ["authenticationToken", "apiToken"]
          example: authenticationToken
        username:
          type: string
          description: The username used for Basic authentication when `tokenType` is `apiToken` (Atlassian account email for an API token, or Bitbucket workspace username for an App Password).
          example: jane.doe@example.com
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the credential was created
        createdBy:
          type: string
          description: Who created the credential
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the credential was last updated
        updatedBy:
          type: string
          description: Who last updated the credential
    DataContract:
      $ref: "schemas/odcs-json-schema-v3.1.0.json"
    GenerateRequest:
      type: object
      description: Request body for code generation.
      required:
        - type
      properties:
        type:
          type: string
          description: |
            The type of code to generate. Supported values:
            - `sql-select` - SQL SELECT statements
            - `sql-ddl` - SQL CREATE TABLE DDL statements
            - `dbt-models` - dbt model SQL files with schema YAML
            - `dbt-sources` - dbt sources YAML
            - `json-schema` - JSON Schema
            - `pydantic` - Python Pydantic models
            - `custom` - AI-powered custom code generation (requires prompt)
          enum:
            - sql-select
            - sql-ddl
            - dbt-models
            - dbt-sources
            - json-schema
            - pydantic
            - custom
          example: "sql-select"
        prompt:
          type: string
          description: The prompt for AI-powered custom code generation. Required when type is 'custom'.
          example: "Generate a Spark DataFrame reader for this data contract"
    GenerateResponse:
      type: object
      description: Response containing generated code files.
      required:
        - dataContractId
        - generationType
        - files
      properties:
        dataContractId:
          type: string
          description: The ID of the data contract used for generation.
          example: "my-data-contract"
        generationType:
          type: string
          description: The type of code that was generated.
          enum:
            - sql-select
            - sql-ddl
            - dbt-models
            - dbt-sources
            - json-schema
            - pydantic
            - custom
          example: "sql-select"
        files:
          type: array
          description: List of generated files.
          items:
            $ref: '#/components/schemas/GeneratedFile'
        prompt:
          type: string
          description: The prompt used for custom generation (only present for custom type).
          example: "Generate a Spark DataFrame reader"
    GeneratedFile:
      type: object
      description: A generated code file.
      required:
        - filename
        - language
        - content
      properties:
        filename:
          type: string
          description: The suggested filename for this generated code.
          example: "orders.sql"
        language:
          type: string
          description: The programming language or format of the generated code.
          example: "sql"
        content:
          type: string
          description: The generated code content.
          example: "SELECT\n    \"order_id\",\n    \"customer_id\"\nFROM \"orders\""
        metadata:
          type: object
          description: Additional metadata about the generated file.
          additionalProperties: true
          example:
            serverType: "snowflake"
    GitImportRequest:
      type: object
      description: |
        Request to import a data contract or data product from a Git repository.

        Credentials can be resolved in two ways:
        - **Explicit:** Set `gitCredentialExternalId` to reference a specific credential by its `externalId`. The `gitConnectionType` and `host` fields are optional and, if provided, are validated against the resolved credential.
        - **Implicit:** Set `gitConnectionType` (and optionally `host`) to resolve credentials automatically via the credential hierarchy (user → team → organization).

        At least one of `gitCredentialExternalId` or `gitConnectionType` must be provided.
      required:
        - repositoryUrl
        - repositoryPath
      properties:
        gitCredentialExternalId:
          type: string
          description: |
            The `externalId` of a git credential to use for authentication, exactly as returned in the `externalId` field of `GET /api/organization/gitcredentials` (or the team/user equivalent). When set, credentials are resolved by this identifier instead of by `gitConnectionType`/`host` matching.

            This must be the credential's `externalId` — not its `id` (UUID) and not its `tokenName`/Connection Name. Credentials created through the web UI have no `externalId`; to reference one explicitly, first assign an `externalId` via `PUT /api/organization/gitcredentials/{id}` (or the team/user equivalent). Otherwise omit this field and set `gitConnectionType` (and `host`) to resolve the credential implicitly.
          example: "my-github-ci"
        gitConnectionType:
          type: string
          description: The type of git provider. Required when `gitCredentialExternalId` is not provided. When both are provided, the value is validated against the resolved credential's type.
          enum:
            - github
            - gitlab
            - bitbucket
            - azuredevops
          example: "github"
        host:
          type: string
          description: The host of a self-hosted git provider instance. Required for self-hosted providers, omit for SaaS. When `gitCredentialExternalId` is provided, validated against the resolved credential's host.
          example: "https://gitlab.example.com"
        repositoryUrl:
          type: string
          description: The URL of the Git repository.
          example: "https://github.com/my-org/data-contracts"
        repositoryBranch:
          type: string
          description: The branch to use. Defaults to 'main'.
          default: "main"
          example: "main"
        repositoryPath:
          type: string
          description: The path to the YAML file in the repository.
          example: "contracts/my-contract.yaml"
    GitConnectionResponse:
      type: object
      description: Git connection details for a data contract or data product.
      properties:
        gitConnectionId:
          type: string
          format: uuid
          description: Unique identifier of the git connection.
        gitCredentialExternalId:
          type: string
          description: The `externalId` of the git credential used for this connection, if one was specified.
          example: "my-github-ci"
        gitConnectionType:
          type: string
          description: The type of git provider.
          enum:
            - github
            - gitlab
            - bitbucket
            - azuredevops
          example: "github"
        host:
          type: string
          description: The host of a self-hosted git provider instance. Null for SaaS providers.
          example: "https://gitlab.example.com"
        repositoryUrl:
          type: string
          description: The URL of the Git repository.
          example: "https://github.com/my-org/data-contracts"
        repositoryBranch:
          type: string
          description: The branch of the Git repository.
          example: "main"
        repositoryPath:
          type: string
          description: The path to the YAML file in the repository.
          example: "contracts/my-contract.yaml"
        syncStatus:
          type: string
          description: The sync status between the data contract and the Git file.
          enum:
            - UP_TO_DATE
            - LOCAL_IS_NEWER
            - REMOTE_IS_NEWER
            - CONFLICT
            - INITIAL_SYNC
          example: "UP_TO_DATE"
        webLink:
          type: string
          description: A web link to the file in the Git provider UI.
          example: "https://github.com/my-org/data-contracts/blob/main/contracts/my-contract.yaml"
        lastHash:
          type: string
          description: The last known commit hash of the file.
          example: "abc123def456"
    GitConnectionRequest:
      type: object
      description: |
        Request to create or update a git connection for a data contract or data product.

        Credentials can be resolved in two ways:
        - **Explicit:** Set `gitCredentialExternalId` to reference a specific credential by its `externalId`. The `gitConnectionType` and `host` fields are optional and, if provided, are validated against the resolved credential.
        - **Implicit:** Set `gitConnectionType` (and optionally `host`) to resolve credentials automatically via the credential hierarchy (user → team → organization).

        At least one of `gitCredentialExternalId` or `gitConnectionType` must be provided.
      required:
        - repositoryUrl
        - repositoryPath
      properties:
        gitCredentialExternalId:
          type: string
          description: |
            The `externalId` of a git credential to use for authentication, exactly as returned in the `externalId` field of `GET /api/organization/gitcredentials` (or the team/user equivalent). When set, credentials are resolved by this identifier instead of by `gitConnectionType`/`host` matching.

            This must be the credential's `externalId` — not its `id` (UUID) and not its `tokenName`/Connection Name. Credentials created through the web UI have no `externalId`; to reference one explicitly, first assign an `externalId` via `PUT /api/organization/gitcredentials/{id}` (or the team/user equivalent). Otherwise omit this field and set `gitConnectionType` (and `host`) to resolve the credential implicitly.
          example: "my-github-ci"
        gitConnectionType:
          type: string
          description: The type of git provider. Required when `gitCredentialExternalId` is not provided. When both are provided, the value is validated against the resolved credential's type.
          enum:
            - github
            - gitlab
            - bitbucket
            - azuredevops
          example: "github"
        host:
          type: string
          description: The host of a self-hosted git provider instance. Required for self-hosted providers, omit for SaaS. When `gitCredentialExternalId` is provided, validated against the resolved credential's host.
          example: "https://gitlab.example.com"
        repositoryUrl:
          type: string
          description: The URL of the Git repository.
          example: "https://github.com/my-org/data-contracts"
        repositoryBranch:
          type: string
          description: The branch to use. Defaults to 'main'.
          default: "main"
          example: "main"
        repositoryPath:
          type: string
          description: The path to the YAML file in the repository.
          example: "contracts/my-contract.yaml"
    GitPushRequest:
      type: object
      description: Optional request body for pushing a data contract to Git.
      properties:
        commitMessage:
          type: string
          description: Custom commit message. If not provided, the default commit message template from the git setting is used.
          example: "Update data contract"
    GitPullRequestRequest:
      type: object
      description: Optional request body for pushing a data contract to Git as a pull request / merge request.
      properties:
        commitMessage:
          type: string
          description: Custom commit message for the commit on the new branch. If not provided, the default commit message template is used.
          example: "Update data contract"
        branchName:
          type: string
          description: Name of the new branch. If not provided, a branch name is generated from the branch name template in the git settings.
          example: "update-my-contract-1706000000"
        title:
          type: string
          description: Title of the pull request / merge request. If not provided, a default title is generated.
          example: "Update contracts/my-contract.yaml"
        comment:
          type: string
          description: Optional description or comment for the pull request / merge request.
          example: "Automated update via API"
    Definition:
      type: object
      required:
        - id
        - owner
      properties:
        id:
          type: string
          description: An organizational unique technical identifier for this definition. Must be same as the path parameter.
          example: checkout/customer_name
        owner:
          type: string
          description: The owner of the definition (the ID of a team).
          example: checkout
        title:
          type: string
          description: "The business name of this definition."
          example: "Customer Name"
        description:
          type: string
          description: "Clear and concise explanations related to the domain."
          example: "The full name of the customer, including first and last name."
        type:
          type: string
          description: "The logical data type."
          example: "string"
          externalDocs:
            description: "Available logical data types from the Open Data Contract Standard (ODCS)"
            url: "https://bitol-io.github.io/open-data-contract-standard/"
        enum:
          type: array
          description: "A list of possible values."
          items:
            type: string
            example: "some-value"
          example: [ "make", "buy", "ignore" ]
        minLength:
          type: number
          description: "A value must be greater than or equal to this value. Applies only to string types."
          example: 1
        maxLength:
          type: number
          description: "A value must be less than or equal to this value. Applies only to string types."
          example: 100
        minimum:
          type: number
          description: "A value must be greater than or equal to this value. Applies only to numeric types."
          example: 0
        maximum:
          type: number
          description: "A value must be less than or equal to this value. Applies only to numeric types."
          example: 100
        exclusiveMinimum:
          type: number
          description: "A value must be greater than this value. Applies only to numeric types."
          example: 0
        exclusiveMaximum:
          type: number
          description: "A value must be less than this value. Applies only to numeric types."
          example: 100
        format:
          type: string
          description: "Specific format requirements for the value (e.g., 'email', 'uri', 'uuid')."
          example: "email"
        pattern:
          type: string
          description: "A regular expression pattern the value must match. Applies only to string types."
          example: "^[a-zA-Z0-9_]*$"
        example:
          type: string
          description: "An example value."
          example: "John Doe"
        pii:
          type: boolean
          description: "Indicates if the field contains Personal Identifiable Information (PII)."
          example: true
        classification:
          type: string
          description: "The data class defining the sensitivity level for this field."
          example: "sensitive"
        tags:
          type: array
          items:
            type: string
            example: "customer"
          description: "Custom metadata to provide additional context."
          example: [ "customer", "name" ]

    Asset:
      description: A data asset refers to any data-related resource or entity that can be managed and tracked within the system, such as a database table, file, or data pipeline.
      type: object
      properties:
        id:
          type: string
          description: An organizational unique technical identifier for this definition. Must be same as the path parameter.
          example: "047bde7c-87d4-488a-b6d2-cef6f6f60001"
        info:
          type: object
          description: Information about the asset.
          properties:
            owner:
              type: string
              description: The owner of the definition (the ID of a team). It is optional, but if it is set, it must be an existing team ID.
              example: "team-456"
            source:
              type: string
              description: The source of the asset.
              example: "snowflake"
            sourceId:
              type: string
              description: The source identifier of the asset.
              example: "047bde7c-87d4-488a-b6d2-cef6f6f60001"
            sourceUrl:
              type: string
              description: The URL of the source.
              example: "https://example.com/my-database/my-asset"
            type:
              type: string
              description: The type of the asset. For example snowflow_schema, databricks_table, ...
              example: "snowflake_table"
            name:
              type: string
              description: The display name of the asset. Typically the last segment of the qualified name.
              example: "my_table"
            qualifiedName:
              deprecated: true
              type: string
              description: The qualified name of the asset.
              example: "ORDERDB.PUBLIC.my_table"
            version:
              type: string
              description: The version of the asset.
              example: "0"
            status:
              type: string
              description: The status of the asset.
              example: "active"
            description:
              type: string
              description: A description of the asset.
              example: "This is a description."
        properties:
          type: object
          deprecated: true
          description: "Deprecated: use `custom` instead. Additional properties of the asset."
          additionalProperties: true
          example:
            account: "my_account"
            database: "ORDERDB"
            schema: "PUBLIC"
            table: "my_table"
        custom:
          type: object
          description: Additional custom properties of the asset. Can be a string or a complex object.
          additionalProperties: true
          example:
            account: "my_account"
            database: "ORDERDB"
            schema: "PUBLIC"
            table: "my_table"
        columns:
          type: array
          description: If the asset type has a schema (such as a table or structured files), define the columns. Columns support nested structures via `properties` (for object/record types) and `items` (for array types).
          items:
            $ref: '#/components/schemas/AssetColumn'
        relationships:
          type: array
          description: The relationships of the asset to other assets. A relationship from a child to its parent with relationshipType `parent` allows you to generate a datacontract with this relationship represented. Children will appear as such in the UI automatically.
          items:
            type: object
            properties:
              relationshipType:
                type: string
                description: The type of the relationship. Use `parent` to define a parent-child relationship.
                example: "parent"
              assetId:
                type: string
                description: The ID of the related asset (it should also be in the system).
                example: "047bde7c-87d4-488a-b6d2-cef6f6f60003"
        tags:
          type: array
          description: Tags associated with the asset.
          items:
            type: string
          example: ["pii:true", "classification:Full Name"]
        assignedTags:
          type: array
          description: Tags associated with the asset via UI.
          readOnly: true
          items:
            type: string
          example: [ "pii:true", "governance/internal" ]
        links:
          type: object
          description: Links associated with the asset.
          additionalProperties:
            type: string
          example:
            "Purview Data Map": "https://link1.com"
            "Azure SQL Explorer": "https://link2.com"
    AssetColumn:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: The name of the column.
          example: "orderId"
        type:
          type: string
          description: The type of the column from the type system of the data source (e.g., Avro types for Kafka, SQL types for databases).
          example: "string"
        description:
          type: string
          description: A description of the column.
          example: "Unique order identifier"
        required:
          type: boolean
          description: Whether this column is required.
        unique:
          type: boolean
          description: Whether this column must contain unique values.
        primaryKey:
          type: boolean
          description: Whether this column is a primary key.
        properties:
          type: array
          description: Nested columns for object/record types. Use this to define the fields of a structured column.
          items:
            $ref: '#/components/schemas/AssetColumn'
        items:
          $ref: '#/components/schemas/AssetColumn'
          description: Schema of array elements. Use this to define the structure of each item in an array column.
        qualifiedName:
          type: string
          deprecated: true
          description: "Deprecated: use a custom property instead. The qualified name of the column."
          example: "db.schema.table.column"
        tags:
          type: array
          description: Tags associated with the column.
          items:
            type: string
          example: ["pii", "financial"]
        links:
          type: object
          description: Links associated with the column.
          additionalProperties:
            type: string
        custom:
          type: object
          description: Additional custom properties of the column.
          additionalProperties: true
    AssetTags:
      type: array
      example: [ "pii:true", "governance/internal" ]
    ClassificationScheme:
      type: object
      required:
        - externalId
        - name
      properties:
        externalId:
          type: string
          description: Stable, organization-unique identifier of the scheme. Must match the path parameter on PUT.
          example: classification
        name:
          type: string
          description: Display name of the scheme.
          example: Classification
        description:
          type: string
          description: Optional description of what the scheme classifies.
          example: The sensitivity and confidentiality of the data.
        customProperty:
          type: string
          description: >
            The customProperty the scheme's value serializes to (ODPS/ODCS customProperties, semantic
            concept custom fields). The reserved value "classification" maps to the standard ODCS/ODPS
            classification field and marks this scheme as the organization's default. Leave blank to
            derive "classification.<externalId>".
          example: classification
        rank:
          type: integer
          description: Display order; lower is shown first. Assigned automatically when omitted.
          example: 1
        classifications:
          type: array
          description: The ordered classification tiers belonging to this scheme.
          items:
            $ref: '#/components/schemas/Classification'
    Classification:
      type: object
      required:
        - externalId
        - name
      properties:
        externalId:
          type: string
          description: Stable, scheme-unique identifier of the tier. Tiers are matched by this on sync.
          example: sensitive
        name:
          type: string
          description: Display name of the tier. This is the value serialized into specifications.
          example: Sensitive
        level:
          type: integer
          description: Sensitivity level; higher is more sensitive. Used to roll up to the most sensitive value.
          example: 4
        description:
          type: string
          description: Short description shown alongside the tier.
          example: Highly sensitive data, strictest controls.
        criteria:
          type: string
          description: Markdown guidance on when this tier applies.
        colorScheme:
          type: string
          description: Named color for the tier's badge.
          example: red
        icon:
          type: string
          description: Inline SVG markup for the tier's badge icon.
    Tag:
      type: object
      required:
        - id
        - owner
      properties:
        id:
          type: string
          description: An organizational unique technical identifier for this tag. Must be same as the path parameter.
          example: Governance/PII
        info:
          type: object
          description: Information of the tag
          properties:
            owner:
              type: string
              description: The owner of the tag (the ID of a team).
              example: checkout
            description:
              type: string
              description: "Clear and concise explanations related to the tag."
              example: "This tag is used to categorize an entity as pii."
        links:
          type: object
          description: Links associated with the tag.
          additionalProperties:
            type: string
          example:
            "Purview Data Map": "https://link1.com"
            "Azure SQL Explorer": "https://link2.com"
        properties:
          type: object
          description: Properties can be used to add additional information to the tag.
          additionalProperties: {
            type: string
          }

    Cost:
      type: object
      required:
        - dataProductId
        - name
        - amount
        - currency
      description: An expense of a data product.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The unique identifier of the cost. Is automatically generated by the Entropy Data.
          example: 640864de-83d4-4619-afba-ccea8037ed3a
        dataProductId:
          type: string
          description: The identifier of the data product this cost is associated with.
          example: data-product-1
        name:
          type: string
          description: The name of the cost.
          example: AWS S3
        yearMonth:
          type: string
          format: year-month
          description: The year and month of the cost. Use this to report costs for a specific month. The format is YYYY-MM. Leave this empty if the cost is valid for every month.
          pattern: '^\d{4}-\d{2}$'
          example: 2023-01
        amount:
          type: number
          description: The amount of the cost.
          example: 1234.45
        currency:
          type: string
          description: The currency of the cost.
          example: USD
        estimated:
          type: boolean
          default: false
          description: Indicates if the cost is estimated. Use this to report costs for the current month that are not yet final.
          example: false
        category:
          type: string
          description: The category of the cost. Use this to group costs together.
          example: Data Platform
        description:
          type: string
          description: A description of the cost.
          example: Costs for the AWS S3 bucket
        tags:
          type: array
          description: Tags are used to categorize costs.
          items:
            type: string
            example: "aws"
        link:
          type: string
          format: uri
          description: A link to the cost report.
          example: https://example.com/link-to-aws-costexplorer

    Integration:
      type: object
      required:
        - externalId
        - name
        - source
        - enabled
      properties:
        externalId:
          type: string
          description: User-facing identifier, unique within an organization. The key used in all API paths and CLI commands.
          example: demo-snowflake
        name:
          type: string
          description: Human-readable display name.
          example: Demo Snowflake
        source:
          type: string
          enum: [snowflake, databricks, bigquery, postgres, mysql, mariadb, mssql, exasol, glue, alation, fabric, powerbi]
          description: The source platform this integration ingests from.
        enabled:
          type: boolean
          description: Whether the integration's schedule is enabled. Disabled integrations can still be run manually.
        assetOwnerTeamExternalId:
          type: string
          nullable: true
          description: External id of the team that owns ingested assets. Null for org-wide integrations.
        configuration:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            Decrypted, provider-specific configuration (credentials excluded). Returned only on the
            single-integration GET (`GET /api/integrations/{integration}`); omitted from the list view.
    UnityCatalogMetadataIntegration:
      type: object
      required:
        - externalId
        - name
        - enabled
      properties:
        externalId:
          type: string
          description: User-facing identifier, unique within an organization among all integrations. The key used in all API paths.
          example: lakehouse
        name:
          type: string
          description: Human-readable display name.
          example: Lakehouse
        enabled:
          type: boolean
          description: Whether the integration writes; a disabled one keeps storing the events that concern it and catches up once enabled again.
        credential:
          type: object
          nullable: true
          description: The credential without its secret. Returned on the single-integration GET and after a PUT; omitted from the list view.
          properties:
            databricksHost:
              type: string
            databricksClientId:
              type: string
            databricksWarehouseId:
              type: string
              nullable: true
        status:
          $ref: '#/components/schemas/UnityCatalogMetadataStatus'
    UnityCatalogMetadataStatus:
      type: object
      nullable: true
      description: The state of a writing integration. Null for an asset import.
      required:
        - inSync
        - unresolved
        - failed
        - waitingEvents
        - taskRunning
      properties:
        inSync:
          type: integer
          format: int64
          description: Tables whose metadata matches the data contract.
        unresolved:
          type: integer
          format: int64
          description: Tables a data contract names that do not exist on the platform, or that the credential cannot see.
        failed:
          type: integer
          format: int64
          description: Tables whose last write failed; see the item's `lastError`.
        waitingEvents:
          type: integer
          format: int64
          description: Stored change events the integration has not processed yet.
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
          description: When the earliest waiting event is due.
        taskExecutionTime:
          type: string
          format: date-time
          nullable: true
          description: When the integration's task runs next; null when no task is scheduled.
        taskRunning:
          type: boolean
          description: Whether the integration's task runs at this moment.
        taskConsecutiveFailures:
          type: integer
          description: Runs of the task that failed in a row, for example because the platform refused the credential. Single tables that fail count in `failed` instead.
        taskLastFailure:
          type: string
          format: date-time
          nullable: true
          description: When the task last failed as a whole.
        lastWrittenAt:
          type: string
          format: date-time
          nullable: true
          description: When the integration last wrote to a table.
        retryingEvents:
          type: integer
          format: int64
          description: Waiting events that failed at least once and wait for another attempt.
        lastRun:
          type: object
          nullable: true
          description: What the last execution of the integration's task did; null before the first.
          required: [at, outcome, events, givenUp, durationMs]
          properties:
            at:
              type: string
              format: date-time
            outcome:
              type: string
              enum: [completed, continued, waiting, paused, failed, no_session, stale_heartbeat, disabled]
              description: >-
                `completed` wrote every event; `continued`/`waiting` left events for a later run; `paused` was refused by
                the platform for a while (a rate limit); `failed` and `no_session` gave their events up, the latter because
                the credential was refused; `stale_heartbeat` and `disabled` stopped early.
            events:
              type: integer
              description: Events the run processed.
            givenUp:
              type: integer
              description: Events the run gave up on.
            durationMs:
              type: integer
              format: int64
            error:
              type: string
              nullable: true
              description: The platform's reason, when the run was refused or paused.
    UnityCatalogMetadataIntegrationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Human-readable display name.
          example: Lakehouse
        credential:
          type: object
          nullable: true
          description: >-
            The credential the integration writes with, in the shape its platform needs; for Databricks the OAuth
            service principal below. Required on create; omit on update to keep the stored credential.
          required:
            - databricksHost
            - databricksClientId
            - databricksClientSecret
          properties:
            databricksHost:
              type: string
              description: The workspace host, with or without `https://`.
              example: adb-1234567890123456.7.azuredatabricks.net
            databricksClientId:
              type: string
              description: The application id of the service principal.
            databricksClientSecret:
              type: string
              description: The OAuth secret of the service principal. Never returned.
            databricksWarehouseId:
              type: string
              nullable: true
              description: Databricks only. The SQL warehouse that runs the `COMMENT ON` statements. Without it the integration writes tags only.
        enabled:
          type: boolean
          nullable: true
          description: Whether the integration writes. Omitted, the state stays as it is; a new integration is enabled.
    UnityCatalogMetadataTable:
      type: object
      required:
        - dataContractExternalId
        - dataContractElement
        - tableFullName
        - state
      properties:
        dataContractExternalId:
          type: string
        dataContractElement:
          type: string
          description: The server and schema object of the data contract that names the table.
          example: lake/orders
        tableFullName:
          type: string
          description: The full name of the table on the platform, as the data contract gives it.
          example: sales.public.orders
        tableUrl:
          type: string
          nullable: true
          description: A link to the table on the platform, when the table was found.
        state:
          type: string
          enum: [in_sync, unresolved, failed]
        notes:
          type: string
          nullable: true
          description: What the writer left out, and why (for example tags above the platform limits).
        lastError:
          type: string
          nullable: true
        lastWrittenAt:
          type: string
          format: date-time
          nullable: true
    UnityCatalogMetadataQueueEntry:
      type: object
      required:
        - eventType
        - externalId
        - since
        - attempts
      properties:
        eventType:
          type: string
          description: The application event, e.g. `DataContractUpdatedEvent`, or `DataContractWriteRequested` for a retry a person asked for.
        externalId:
          type: string
          description: The id of the data contract, or of the concept, the event is about.
        since:
          type: string
          format: date-time
          description: When the change happened.
        resourceVersion:
          type: integer
          format: int64
          nullable: true
          description: The revision of the data contract the event stands for, as on its compare page; null for other resources.
        attempts:
          type: integer
          description: How often the event was tried; after eight failed attempts it is given up.
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
    UnityCatalogMetadataActionResponse:
      type: object
      required:
        - integrationExternalId
        - count
        - message
      properties:
        integrationExternalId:
          type: string
        count:
          type: integer
        message:
          type: string
    IngestIntegrationRequest:
      type: object
      required:
        - configuration
      properties:
        configuration:
          type: object
          additionalProperties: true
          description: >-
            The provider's configuration, as `GET /api/integrations/ingest/{integration}` returns it: `source`,
            `name`, `scheduleExpression`, `description`, `filters` and `assetOwnerTeamExternalId`. `externalId` is
            taken from the path.
          example:
            source: snowflake
            name: Demo Snowflake
            scheduleExpression: "0 0 2 * * ?"
            description: Nightly import of the sales database
            assetOwnerTeamExternalId: data-platform
        credential:
          type: object
          nullable: true
          description: >-
            The provider's credential: `type` and `details`, in the shape the provider stores it (for Snowflake e.g.
            `type: pat` with `account`, `user`, `pat`). Required on create; omitted on update, the stored credential
            stays; a secret field left blank keeps its stored value.
          properties:
            type:
              type: string
            details:
              type: object
              additionalProperties: true
        enabled:
          type: boolean
          nullable: true
          description: Whether the schedule is enabled. Omitted, it stays as it is; a new import is enabled.
    IngestionRun:
      type: object
      required:
        - ingestionRunId
        - integrationExternalId
        - status
        - assetsProcessed
        - assetsCreated
        - assetsUpdated
        - assetsDeleted
        - startedAt
      properties:
        ingestionRunId:
          type: string
          format: uuid
          description: >-
            The run's identity and path key at
            `/api/integrations/{integration}/runs/{ingestionRunId}`. Runs have no external id of their own.
        integrationExternalId:
          type: string
          description: externalId of the integration this run belongs to.
          example: demo-snowflake
        status:
          type: string
          enum: [RUNNING, SUCCESS, FAILED, CANCELLED]
        message:
          type: string
          nullable: true
          description: Free-text status message; populated on completion and on some progress updates.
        assetsProcessed:
          type: integer
          format: int64
        assetsCreated:
          type: integer
          format: int64
        assetsUpdated:
          type: integer
          format: int64
        assetsDeleted:
          type: integer
          format: int64
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the run reaches a terminal status; null while running.
    TriggerRunResponse:
      type: object
      required:
        - integrationExternalId
        - scheduledAt
        - deferred
        - message
      properties:
        integrationExternalId:
          type: string
          description: externalId of the integration the run was scheduled for.
          example: demo-snowflake
        scheduledAt:
          type: string
          format: date-time
          description: Server-time at which the run was scheduled.
        deferred:
          type: boolean
          description: |
            True when the run will only be picked up on the next due-check cycle (~5 minutes)
            rather than starting immediately. Rare; happens when a manual task instance for this
            integration was already queued (e.g. recovered after a server restart).
        message:
          type: string
    IntegrationConflict:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          enum: [already_running]
        message:
          type: string
    Connector:
      type: object
      required:
        - id
        - info
      properties:
        id:
          type: string
          description: The identifier of the connector.
          example: connector-123
        info:
          type: object
          properties:
            type:
              type: string
              description: The type of the connector.
              example: databricks
            description:
              type: string
              description: A description of the connector.
              example: "This is a databricks connector."
            connectorVersion:
              type: string
              description: The version of the connector.
              example: "1.0.0"
        health:
          type: object
          description: The operational health of the connector, as reported by the connector itself.
          properties:
            status:
              type: string
              description: The health status of the connector.
              example: running
            startedAt:
              type: string
              format: date-time
              description: The point in time the connector was started.
              example: 2023-10-01T12:00:00Z
            updatedAt:
              type: string
              format: date-time
              description: The point in time the connector last reported its health.
              example: 2023-10-01T12:00:00Z
            errorMessage:
              type: string
              description: The error that made the connector unhealthy, if there is one.
              example: Connection lost
        state:
          type: object
          additionalProperties: true
          description: The state of the connector.
          example:
            lastEventId: 95837f96-766f-4f8b-96f8-4f337f2a36a6
            lastHeartbeat: 2023-10-01T12:00:00Z
        custom:
          type: object
          additionalProperties: true
          description: Custom fields for the connector.

    ExampleData:
      type: object
      required:
        - id
        - dataProductId
      properties:
        id:
          type: string
          description: A unique identifier for this example data entry.
          example: order-service-orders
        dataProductId:
          type: string
          format: uuid
          description: The ID of the data product this example data belongs to.
        outputPortId:
          type: string
          format: uuid
          description: The ID of the output port this example data belongs to.
        dataContractId:
          type: string
          format: uuid
          description: The ID of the data contract this example data belongs to.
        schemaName:
          type: string
          description: The schema name to group example data entries.
          example: orders
        data:
          description: The example data. Can be a JSON object or a JSON array.

    TestResults:
      type: object
      required:
        - id
        - dataContractId
        - dataContractVersion
        - server
        - timestampStart
        - timestampEnd
        - result
      description: An expense of a data product.
      properties:
        id:
          type: string
          description: A unique identifier for the test run, e.g., a UUID.
          example: 466b4c17-8176-42f1-8199-59125dde5e61
        dataContractId:
          type: string
          description: The id of the data contract that was tested. A data contract with this ID must be available in the system.
          example: search-queries-all
        dataContractVersion:
          type: string
          description: The version of the data contract that was tested.
          example: 1.0.0
        branch:
          type: string
          description: The branch of the data contract that was tested, when a branch was tested rather than the data contract itself. A run against a branch shows on the branch, goes with it when it is merged or deleted, and never counts for the data contract, its notifications or its scores.
          example: add-order-status
        server:
          type: string
          description: The server that was tested. A server with this key must be defined in the data contract in the system. If the data contract is linked to a output port of a data product, the server is defined by '${dataProductId}/${outputPortId}'.
          example: production
        timestampStart:
          type: string
          format: date-time
          example: 2024-07-03T10:46:28.195230Z
        timestampEnd:
          type: string
          format: date-time
          example: 2024-07-03T10:46:42.481447Z
        result:
          type: string
          description: The result of the test run.
          enum: [ passed, failed, warning, error, unknown ]
        checks:
          type: array
          items:
            type: object
            required:
              - type
              - result
            properties:
              type:
                type: string
                description: The type of the check, e.g. schema, quality
                example: schema
              name:
                type: string
                description: The name of the check, including the field or rule that was checked
                example: Check that field order_id is present
              qualityReference:
                type: string
                description: Scope unique identifier that references the check's reference in the contract (could be slaProperties[*].id, quality.id at schema or property level)
                example: orderIdUnique
              qualityCategory:
                type: string
                description: Category the check falls into.
                example: schema|quality|servicelevel
              dimension:
                type: string
                description: "Quality Dimension of the data contract. ODCS supports: accuracy (synonym ac), completeness (synonym cp), conformity (synonym cf), consistency (synonym cs), coverage (synonym cv), timeliness (synonym tm), uniqueness (synonym uq). But you can choose your own dimensions or other names."
                example: accuracy
              qualityCheckDefinition:
                type: string
                description: Calculation logic and threshold information of the check
                example: |
                    implementation:
                      type: duplicate_percent  # Block
                      columns:                 # passed as-is
                        - carrier              # to the tool
                        - shipment_numer       # (Soda in this situation)
                      must_be_less_than: 1.0   #
              failedNumber:
                type: integer
                description: Number of rows that failed the defined check
                example: 102
              totalNumber:
                type: integer
                description: Total number of rows that the check was applied to
                example: 104
              failedSamples:
                type: array
                items:
                  type: string
                description: A set of samples that failed the quality check.
                example: [ "ORDER-4711", "ORDER-4712" ]
              result:
                type: string
                description: >-
                  The result of the check. `skipped` means the engine did not execute it.
                enum: [ passed, failed, warning, error, skipped, unknown ]
                example: passed
              engine:
                type: string
                description: The engine that performed the check
                example: datacontract-cli
              model:
                type: string
                description: The model that was checked
                example: orders
              field:
                type: string
                description: The field that was checked
                example: order_id
              reason:
                type: string
                description: The reason for the result
                example: Field order_id is present
              details:
                type: string
                description: Additional details about the check
                example: Checked order_id
        logs:
          type: array
          description: Additional log output from the test run or the test engines
          items:
            type: object
            properties:
              level:
                type: string
                description: The log level, e.g. INFO, WARN, ERROR
                example: INFO
              message:
                type: string
                description: The log message
                example: "Running tests for data contract urn:datacontract:checkout:orders-latest with server production"
              timestamp:
                type: string
                format: date-time
                example: 2024-07-03T10:46:29.083871Z
    SemanticNamespace:
      type: object
      description: EXPERIMENTAL A semantic namespace groups a set of concepts and relationships.
      required:
        - name
      properties:
        namespace:
          type: string
          description: The unique namespace identifier within the organization. Must match the path parameter when both are provided.
          example: main
        name:
          type: string
          description: A human-readable name for the namespace.
          example: Main
        description:
          type: string
          description: A description of the namespace.
          example: The default namespace for the organization.
        read_only:
          type: boolean
          default: false
          description: When true, the namespace cannot be modified through the UI. API edits are still possible.
          example: false
        team:
          type: string
          description: The owning team's external id. The caller must have edit permission on the team to set this.
          example: checkout
        kind:
          type: string
          readOnly: true
          description: |
            `branch` marks the hidden working copy a branch is. Branches are excluded from this
            listing, from search, from the SPARQL dataset and from the marketplace; they are reachable only
            by name, which is how a branch is authored through the ordinary namespace endpoints.
          enum: [namespace, branch]
          default: namespace
    SemanticBranch:
      type: object
      description: |
        EXPERIMENTAL A branch of a semantic namespace: a hidden namespace holding a copy of it, where
        changes are authored before they are merged back.
      properties:
        name:
          type: string
          readOnly: true
          description: The branch name, as it was cut.
          example: add-subscription-billing
        namespace:
          type: string
          readOnly: true
          description: The namespace the branch was cut from.
          example: main
        branch_namespace:
          type: string
          readOnly: true
          description: The hidden namespace slug the branch is stored under. Informational — the namespace endpoints refuse it; author through `…/branches/{branch}/ontology.yaml`.
          example: branch-main-add-subscription-billing
        behind_target:
          type: boolean
          readOnly: true
          description: Whether the namespace has changed since the branch was last updated from it. When true, a rebase has something to take on.
        conflicted:
          type: boolean
          readOnly: true
          description: Whether the last replay onto the namespace disagreed. A conflicted branch cannot be merged until its author resolves it.
        conflicts:
          type: array
          readOnly: true
          description: Where that replay disagreed, if anywhere. Empty while the branch replays cleanly.
          items:
            $ref: '#/components/schemas/SemanticBranchConflict'
        merge_request:
          readOnly: true
          description: The pull/merge request opened from the branch, while one is open. Its live fields (status, mergeability, comment count) are filled when reading a single branch and left out in the list.
          allOf:
            - $ref: '#/components/schemas/SemanticBranchMergeRequest'
    SemanticBranchMergeRequest:
      type: object
      description: EXPERIMENTAL A pull/merge request opened from a branch's git mirror.
      properties:
        remote_id:
          type: string
          description: The request's number at the provider.
          example: "42"
        type:
          type: string
          enum: [pull_request, merge_request]
        title:
          type: string
          example: Merge add-subscription-billing into Global
        url:
          type: string
          nullable: true
          description: The request at the provider.
        status:
          type: string
          nullable: true
          enum: [open, merged, closed]
          description: As the provider reports it; absent when the provider was not asked.
        mergeability:
          type: string
          nullable: true
          enum: [mergeable, conflicted, blocked, unknown]
          description: Whether the provider would merge the request now. `blocked` means clean but held by a rule (review, pipeline, policy); `unknown` while the provider is still computing it.
        comment_count:
          type: integer
          nullable: true
          description: Comments left on the request; absent when the provider was not asked or does not count them.
    SemanticBranchConflict:
      type: object
      properties:
        element_type:
          type: string
          enum: [concept, relationship, namespace]
        external_id:
          type: string
          example: customer
        name:
          type: string
          example: Customer
        reason:
          type: string
          description: Why the two sides could not be reconciled.
          example: bothChanged
    SemanticBranchChange:
      type: object
      description: |
        EXPERIMENTAL One change of a branch — always a concept.

        Inline properties and relationships are reviewed as part of the concept they hang off and appear
        under `properties` and `relationships` rather than as entries of their own.
      properties:
        external_id:
          type: string
          example: customer
        element_type:
          type: string
          enum: [entity, metric, group, shared_property, property, namespace]
          example: entity
        name:
          type: string
          example: Customer
        op:
          type: string
          enum: [add, modify, remove]
        impact:
          type: string
          description: How consequential the change is. `structural` alters what the graph means; `descriptive` alters how it reads; `cosmetic` is labels only.
          enum: [structural, descriptive, cosmetic]
        warnings:
          type: array
          description: '`renamedAndRedefined` means the edit changed both the name and what it says, which is what a different concept reusing an id looks like.'
          items:
            type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SemanticBranchFieldChange'
        properties:
          type: array
          description: Changes to inline properties this concept holds.
          items:
            $ref: '#/components/schemas/SemanticBranchNestedChange'
        relationships:
          type: array
          description: Changes to relationships hanging off this concept.
          items:
            $ref: '#/components/schemas/SemanticBranchNestedChange'
    SemanticBranchNestedChange:
      type: object
      properties:
        external_id:
          type: string
        name:
          type: string
        op:
          type: string
          enum: [add, modify, remove]
        impact:
          type: string
          enum: [structural, descriptive, cosmetic]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SemanticBranchFieldChange'
    SemanticBranchFieldChange:
      type: object
      properties:
        field:
          type: string
          example: description
        before:
          type: string
        after:
          type: string
    SemanticConcept:
      type: object
      description: |
        EXPERIMENTAL A semantic concept. Concepts can be entities, properties, shared properties, metrics, or groups (selected via `kind`).
        Field availability depends on `kind`: property fields (`data_type`, `required`, `unique`, `business_name`, `examples`, `enum`, `pattern`) only apply to `property` and `shared_property`; metric fields (`unit`, `better_when`, `formula`) only apply to `metric`; `properties` only applies to `entity`.
      required:
        - name
      properties:
        id:
          type: string
          description: An organizational unique technical identifier for this concept within the namespace. Must match the path parameter when both are provided. Can contain "/".
          example: customer
        name:
          type: string
          description: A human-readable name for the concept.
          example: Customer
        kind:
          type: string
          enum:
            - entity
            - shared_property
            - property
            - metric
            - group
          default: entity
          description: The kind of concept.
          example: entity
        description:
          type: string
          description: A description of the concept.
        iri:
          type: string
          description: An optional IRI identifying the concept (typically used to link to an external ontology).
        status:
          type: string
          description: A free-form lifecycle status for this concept (e.g., draft, active, deprecated).
          example: active
        group:
          type: string
          description: The external id of a `group` concept that this concept belongs to.
        team:
          type: string
          description: The owning team's external id. The caller must have edit permission on the team to set this.
          example: checkout
        domain:
          type: string
          description: An optional domain identifier.
        classification:
          type: string
          description: An optional data classification (e.g., internal, confidential, pii).
        tags:
          type: array
          items:
            type: string
          example:
            - core
        ai_context:
          type: object
          description: A free-form map of context hints used by AI features.
          additionalProperties: true
        custom_properties:
          type: object
          description: >-
            OSI open escape hatch (PR #146). A free-form map for data not covered by the core spec —
            IRIs, owl:equivalentClass, provenance — and language-tagged literals via the `name@lang`
            key convention (e.g. `name@de`, `description@fr`). Accepts the prior `custom_fields` name.
          additionalProperties: true
        data_type:
          type: string
          description: Property-only. The data type of the property (e.g., string, integer, boolean).
          example: string
        required:
          type: boolean
          description: Property-only. Whether the property is required.
        unique:
          type: boolean
          description: Property-only. Whether the property is unique.
        business_name:
          type: string
          description: Property-only. A business-friendly name for the property.
        examples:
          type: array
          items:
            type: string
          description: Property-only. Example values for the property.
        enum:
          type: array
          items:
            type: string
          description: Property-only. The set of allowed values for the property.
        pattern:
          type: string
          description: Property-only. A regular expression that values of the property must match.
        unit:
          type: string
          description: Metric-only. The unit of the metric (e.g., USD, count, percent).
        better_when:
          type: string
          description: Metric-only. A hint about whether higher or lower values are better (e.g., higher, lower).
        formula:
          type: string
          description: Metric-only. The formula used to compute the metric.
        properties:
          type: array
          description: |
            Entity-only. The list of properties for an entity. Each entry is either an inline property definition (a SemanticConcept with `kind: property`) or a shared-property reference of the form `{ "ref": "<externalId>" }`. Sending `null` preserves existing properties; sending an empty list removes them all.
          items:
            oneOf:
              - $ref: '#/components/schemas/SemanticConcept'
              - type: object
                required:
                  - ref
                properties:
                  ref:
                    type: string
                    description: The external id of a shared property in the same namespace.
                    example: email
    SemanticRelationshipRole:
      type: object
      description: One side of a relationship — references a concept by external id, optionally in a different namespace.
      required:
        - concept
      properties:
        concept:
          type: string
          description: The external id of the referenced concept. May contain "/".
          example: customer
        namespace:
          type: string
          description: The namespace of the referenced concept. Defaults to the relationship's namespace when omitted.
          example: main
        role_name:
          type: string
          description: An optional role name for this side of the relationship.
        custom_properties:
          type: object
          description: >-
            OSI open escape hatch (PR #146). A free-form map for foreign role data (e.g. `rdfs:range`).
            Only the to-side (second) role's custom_properties are persisted; the from-side is implicit.
          additionalProperties: true
    SemanticRelationship:
      type: object
      description: EXPERIMENTAL A binary relationship between two concepts. Only binary relationships (exactly two `roles` entries) are supported in v0.
      required:
        - type
      properties:
        id:
          type: string
          description: An organizational unique technical identifier for this relationship within the namespace. Must match the path parameter when both are provided.
          example: customer-has-orders
        name:
          type: string
          description: A human-readable name for the relationship.
        description:
          type: string
          description: A description of the relationship.
        type:
          type: string
          description: The relationship type, e.g. `hasProperty`, `isA`, `relatedTo`, `memberOf`.
          example: relatedTo
        roles:
          type: array
          minItems: 2
          maxItems: 2
          description: Exactly two roles — the from-side and the to-side of the relationship.
          items:
            $ref: '#/components/schemas/SemanticRelationshipRole'
        multiplicity:
          type: string
          description: An optional multiplicity hint (e.g., `OneToOne`, `OneToMany`, `ManyToOne`, `ManyToMany`).
          example: ManyToOne
        verbalizes:
          type: array
          items:
            type: string
          description: >-
            OSI natural-language patterns that verbalize the relationship's links. Optional on input;
            auto-generated from the name and roles on export when omitted.
          example:
            - "{Customer} places {Order}"
        custom_properties:
          type: object
          description: >-
            OSI open escape hatch (PR #146). A free-form map for foreign relationship data
            (IRIs, `owl:inverseOf`, …) not covered by the core spec.
          additionalProperties: true
    OtelTracesRequest:
      type: object
      description: OpenTelemetry trace data in OTLP/JSON format for tracking data product usage and query activity.
      properties:
        resourceSpans:
          type: array
          description: Array of resource spans, each containing trace data grouped by resource attributes.
          items:
            type: object
            properties:
              resource:
                type: object
                description: Resource attributes that apply to all spans in this group.
                properties:
                  attributes:
                    type: array
                    description: Key-value attributes describing the resource (service, data product, output port).
                    items:
                      $ref: '#/components/schemas/OtlpAttribute'
              scopeSpans:
                type: array
                description: Array of scope spans, each containing spans grouped by instrumentation scope.
                items:
                  type: object
                  properties:
                    scope:
                      type: object
                      description: Instrumentation scope information.
                      properties:
                        name:
                          type: string
                          description: Name of the instrumentation scope.
                          example: usage
                        version:
                          type: string
                          description: Version of the instrumentation scope.
                          example: 1.0.0
                    spans:
                      type: array
                      description: Array of spans representing individual operations or queries.
                      items:
                        $ref: '#/components/schemas/OtlpSpan'
    OtlpSpan:
      type: object
      description: An OpenTelemetry span representing a single operation or query.
      properties:
        traceId:
          type: string
          description: Unique identifier for the trace.
          example: trace001
        spanId:
          type: string
          description: Unique identifier for the span within the organization. Used for upsert operations.
          example: span001
        name:
          type: string
          description: Optional human-readable name for the span.
          example: Query execution
        kind:
          type: string
          description: The kind of span (e.g., SPAN_KIND_INTERNAL, SPAN_KIND_CLIENT).
          example: SPAN_KIND_INTERNAL
        startTimeUnixNano:
          type: integer
          format: int64
          description: Start time of the span in Unix nanoseconds.
          example: 1704067200000000000
        endTimeUnixNano:
          type: integer
          format: int64
          description: End time of the span in Unix nanoseconds.
          example: 1704067260000000000
        attributes:
          type: array
          description: Span attributes containing query details (user, role, type, query, rows, result, access.id).
          items:
            $ref: '#/components/schemas/OtlpAttribute'
    OtlpAttribute:
      type: object
      description: A key-value attribute in OpenTelemetry format.
      properties:
        key:
          type: string
          description: The attribute key.
          example: user
        value:
          type: object
          description: The attribute value, which can be a string, int, double, bool, or array.
          properties:
            stringValue:
              type: string
              description: String value.
              example: ANALYTICS_TEAM
            intValue:
              type: integer
              format: int64
              description: Integer value.
              example: 1523
            doubleValue:
              type: number
              format: double
              description: Double value.
            boolValue:
              type: boolean
              description: Boolean value.
            arrayValue:
              type: object
              description: Array value containing multiple values.
              properties:
                values:
                  type: array
                  items:
                    $ref: '#/components/schemas/OtlpAttribute'
    OpenLineageRunEvent:
      type: object
      description: An OpenLineage RunEvent representing a lifecycle event for a data pipeline run.
      properties:
        eventType:
          type: string
          description: The type of lifecycle event.
          enum: [START, RUNNING, COMPLETE, ABORT, FAIL]
          example: COMPLETE
        eventTime:
          type: string
          format: date-time
          description: The time the event occurred in ISO 8601 format.
          example: "2024-01-15T10:00:00.000Z"
        run:
          type: object
          description: Information about the run.
          properties:
            runId:
              type: string
              description: Unique identifier for this run.
              example: "d46e465b-d358-4d32-83d4-df660ff614dd"
            facets:
              type: object
              description: |
                Run facets containing additional metadata. Supports standard OpenLineage facets
                and the custom `entropy_data` facet for linking runs to data products.
              additionalProperties: true
              properties:
                entropy_data:
                  $ref: '#/components/schemas/EntropyDataRunFacet'
        job:
          type: object
          description: Information about the job.
          properties:
            namespace:
              type: string
              description: The namespace of the job (e.g., dbt, airflow, spark).
              example: dbt
            name:
              type: string
              description: The name of the job.
              example: my_model
            facets:
              type: object
              description: Job facets containing additional metadata.
              additionalProperties: true
        inputs:
          type: array
          description: Input datasets consumed by this job.
          items:
            $ref: '#/components/schemas/OpenLineageDataset'
        outputs:
          type: array
          description: Output datasets produced by this job.
          items:
            $ref: '#/components/schemas/OpenLineageDataset'
        producer:
          type: string
          description: URI identifying the producer of this event.
          example: "https://github.com/OpenLineage/OpenLineage/tree/0.18.0/integration/dbt"
        schemaURL:
          type: string
          description: URI of the OpenLineage schema for this event.
          example: "https://openlineage.io/spec/2-0-2/OpenLineage.json#/definitions/RunEvent"
      required:
        - eventType
    OpenLineageDataset:
      type: object
      description: An OpenLineage dataset representing an input or output of a job.
      properties:
        namespace:
          type: string
          description: The namespace of the dataset.
          example: "snowflake://account.snowflakecomputing.com"
        name:
          type: string
          description: The name of the dataset.
          example: "analytics_db.public.orders"
        facets:
          type: object
          description: |
            Dataset facets containing additional metadata (schema, data quality, etc.).
            Supports the custom `entropy_data` facet for linking datasets to assets.
          additionalProperties: true
          properties:
            entropy_data:
              $ref: '#/components/schemas/EntropyDataDatasetFacet'
    EntropyDataRunFacet:
      type: object
      description: |
        Custom OpenLineage run facet that links a pipeline run to an Entropy Data data product
        and output port. When present in `run.facets.entropy_data`, the controller uses it as
        a fallback when `dataProductId`/`outputPortName` query parameters are not provided.
      properties:
        _producer:
          type: string
          example: "https://entropy-data.com"
        _schemaURL:
          type: string
          example: "https://entropy-data.com/spec/facets/1-0-0/EntropyDataRunFacet.json"
        dataProductId:
          type: string
          description: The external ID of the data product.
          example: orders
        outputPortName:
          type: string
          description: The external ID of the output port.
          example: snowflake_orders_v2
    EntropyDataDatasetFacet:
      type: object
      description: |
        Custom OpenLineage dataset facet that links an input or output dataset to an
        Entropy Data asset by its external ID.
      properties:
        _producer:
          type: string
          example: "https://entropy-data.com"
        _schemaURL:
          type: string
          example: "https://entropy-data.com/spec/facets/1-0-0/EntropyDataDatasetFacet.json"
        assetId:
          type: string
          description: The external ID of the asset in Entropy Data.
          example: raw-orders
    TeamRolesSettings:
      type: object
      description: >-
        An organization's team roles configuration: the mode plus, when custom,
        the role catalog.
      required:
        - mode
      properties:
        mode:
          type: string
          description: >-
            `default` derives team permissions from the built-in default roles;
            `custom-team-roles` derives them from the organization's custom role
            catalog (`team-roles`).
          enum:
            - default
            - custom-team-roles
          example: custom-team-roles
        team-roles:
          type: array
          description: >-
            The custom team role catalog. Returned (and required) only when
            `mode` is `custom-team-roles`; a `PUT` replaces the entire catalog
            with these roles, matched by `name`.
          items:
            $ref: '#/components/schemas/TeamRole'
    TeamRole:
      type: object
      description: >-
        A custom team role. The `name` is the external identifier and is what
        gets stored on each team member's `role` field.
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          description: The display name of the role. Acts as the external identifier. 3–1000 characters.
          minLength: 3
          maxLength: 1000
          example: Approver
        description:
          type: string
          nullable: true
          description: Optional human-readable description of the role.
          example: Can approve access requests and manage their team's resources.
        rank:
          type: integer
          nullable: true
          description: Display order — lower ranks appear first. Defaults to the role's position in the list.
          example: 100
        permissions:
          type: array
          description: >-
            The set of team permissions this role grants, one per resource and action.
            The generic `RESOURCES_ADD`, `RESOURCES_EDIT`, `RESOURCES_DELETE`, `TEST_EXECUTE`,
            `TEST_RESULTS_WRITE`, `CHANGE_REQUEST_SUBMIT` and `CHANGE_REQUEST_APPROVE` are retired
            but stay accepted: `PUT` expands each into the per-resource permissions it used to stand
            for, so a role definition kept in infrastructure-as-code keeps applying unchanged. `GET`
            always returns the expanded set — a tool that compares the two sees the difference until
            the definition names the per-resource permissions itself.
          items:
            type: string
            enum:
              - DATAPRODUCT_ADD
              - DATAPRODUCT_EDIT
              - DATAPRODUCT_DELETE
              - DATAPRODUCT_CHANGE_REQUEST_SUBMIT
              - DATAPRODUCT_CHANGE_REQUEST_APPROVE
              - DATAPRODUCT_PUBLISH
              - DATAPRODUCT_GIT_CONNECT
              - DATAPRODUCT_TEST_RESULTS_EDIT
              - DATACONTRACT_ADD
              - DATACONTRACT_EDIT
              - DATACONTRACT_DELETE
              - DATACONTRACT_CHANGE_REQUEST_SUBMIT
              - DATACONTRACT_CHANGE_REQUEST_APPROVE
              - DATACONTRACT_BRANCH_ADD
              - DATACONTRACT_TEST_RUN
              - DATACONTRACT_TEST_RESULTS_EDIT
              - DATACONTRACT_GIT_CONNECT
              - SEMANTIC_NAMESPACE_ADD
              - SEMANTIC_NAMESPACE_EDIT
              - SEMANTIC_NAMESPACE_DELETE
              - SEMANTIC_NAMESPACE_BRANCH_ADD
              - SEMANTIC_NAMESPACE_GIT_CONNECT
              - MANAGED_TAG_ADD
              - MANAGED_TAG_EDIT
              - MANAGED_TAG_DELETE
              - MANAGED_TAG_CHANGE_REQUEST_SUBMIT
              - MANAGED_TAG_CHANGE_REQUEST_APPROVE
              - ASSET_ADD
              - ASSET_EDIT
              - ASSET_DELETE
              - ASSET_CHANGE_REQUEST_SUBMIT
              - ASSET_CHANGE_REQUEST_APPROVE
              - POLICY_CHECK_RUN
              - DEFINITION_ADD
              - DEFINITION_EDIT
              - DEFINITION_DELETE
              - SOURCE_SYSTEM_ADD
              - SOURCE_SYSTEM_EDIT
              - SOURCE_SYSTEM_DELETE
              - ACCESS_ADD
              - ACCESS_EDIT
              - ACCESS_DELETE
              - ACCESS_REQUEST
              - ACCESS_APPROVE
              - ACCESS_TERMINATE
              - TEAM_ADD
              - TEAM_EDIT
              - TEAM_DELETE
              - TEAM_API_KEY_MANAGE
              - TEAM_MEMBER_ADD
              - TEAM_MEMBER_EDIT
              - TEAM_MEMBER_DELETE
              - INGESTION_EDIT
              - RESOURCES_ADD
              - RESOURCES_EDIT
              - RESOURCES_DELETE
              - TEST_EXECUTE
              - TEST_RESULTS_WRITE
              - CHANGE_REQUEST_SUBMIT
              - CHANGE_REQUEST_APPROVE
          example:
            - DATAPRODUCT_ADD
            - DATAPRODUCT_EDIT
            - DATACONTRACT_EDIT
            - ACCESS_APPROVE
    DataProductTypes:
      type: object
      description: The data product types of an organization, in display order.
      properties:
        dataProductTypes:
          type: array
          items:
            $ref: '#/components/schemas/DataProductType'
    DataProductType:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
          description: >-
            The type id stored on data products; trimmed and lowercased on input. Built-in ids are `source-aligned`, `aggregate`,
            `consumer-aligned`, `application`, `dataconsumer`, `ai-agent`, and the system types
            `powerbi-report` and `powerbi-semanticmodel`.
          example: source-aligned
        outputPorts:
          type: boolean
          default: true
          description: Whether data products of this type can have output ports. Ignored for built-in ids.
        behavior:
          type: string
          readOnly: true
          description: The behavior derived from the type, ignored on input.
          enum:
            - data-product
            - application
            - data-consumer
            - ai-agent
            - powerbi-report
            - powerbi-semantic-model
        labels:
          type: object
          description: Display label per language code. A custom type needs at least one.
          additionalProperties:
            type: string
          example:
            en: Source-aligned
        descriptions:
          type: object
          description: Description per language code.
          additionalProperties:
            type: string
        examples:
          type: object
          description: Examples per language code.
          additionalProperties:
            type: string
        icon:
          type: string
          description: Icon key; the behavior's default icon when not set.
        enabled:
          type: boolean
          default: true
          description: Whether the type can be chosen for new data products. At least one type must be enabled.
        showOnMarketplaceHome:
          type: boolean
          description: Whether data products of this type are shown on the marketplace home page. Defaults by behavior when not set.
        default:
          type: boolean
          default: false
          description: Whether the type is preselected for new data products. At most one enabled type can be the default.
        builtIn:
          type: boolean
          readOnly: true
          description: True while the organization has not defined its own types, and for the system types. Ignored on input.
    EmailTemplatesSettings:
      type: object
      description: >-
        An organization's email templates, keyed by email type (e.g. `access-rejected`). `GET`
        returns every type; a `PUT` may list only the types it changes — the rest revert to the
        built-in email.
      properties:
        templates:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EmailTemplateSettings'
          example:
            access-rejected:
              enabled: true
              canBeDisabled: true
              variables:
                - name: consumerType
                  optional: false
                - name: reason
                  optional: true
                - name: url
                  optional: false
                - name: supportEmail
                  optional: false
              languages:
                en:
                  subject: "Your access request was rejected"
                  body: "{{#if reason}}Reason: {{reason}}{{/if}}\n\nContact {{supportEmail}} if you have questions."
                  customized: true
                de:
                  subject: "Deine Zugriffsanfrage wurde abgelehnt"
                  body: "..."
                  customized: false
            access-requested:
              enabled: false
    EmailTemplateSettings:
      type: object
      description: One email type.
      properties:
        enabled:
          type: boolean
          description: Whether the organization sends this email. Omitted on input means enabled. `false` is rejected for types that cannot be disabled.
          example: true
        canBeDisabled:
          type: boolean
          readOnly: true
          description: Whether the organization may switch this email off. Only the `invitation` cannot be disabled.
        variables:
          type: array
          readOnly: true
          description: The variables the subject and body may reference.
          items:
            type: object
            properties:
              name:
                type: string
                example: reason
              optional:
                type: boolean
                description: Whether the variable may be empty when the email is sent; wrap dependent text in `{{#if ...}}...{{/if}}`.
        languages:
          type: object
          description: >-
            The effective subject and body keyed by BCP-47 language code, e.g. `en` or `de`. Once a
            type is customized in any language, that wording is also used for languages without
            their own customization.
          additionalProperties:
            $ref: '#/components/schemas/EmailTemplateContent'
    EmailTemplateContent:
      type: object
      description: The wording of one email in one language, using `{{variable}}` placeholders and `{{#if variable}}...{{/if}}` blocks.
      required:
        - subject
        - body
      properties:
        subject:
          type: string
          example: "Your access request to {{dataProductTitle}} was rejected"
        body:
          type: string
          example: "{{#if reason}}Reason: {{reason}}{{/if}}\n\nContact {{supportEmail}} if you have questions."
        customized:
          type: boolean
          readOnly: true
          description: "`true` when the organization customized this wording, `false` when it is the built-in text."
    OrganizationMember:
      type: object
      description: An organization user
      properties:
        emailAddress:
          type: string
          description: The email address of the user
          example: mail@example.com
          readOnly: true
        userId:
          type: string
          description: An internal unique identifier for the user. Typically starts with u.
          example: u466b4c17a345e61
          readOnly: true
        role:
          type: string
          description: The role of the user of the organization.
          example: Member
          enum:
            - Member
            - Owner
        custom:
          type: object
          description: Custom fields can be used to add additional information to the user.
          additionalProperties: {
            type: string
          }
    DataProductCreatedEvent:
      type: object
      description: A data product was created.
      required:
        - id
        - timestamp
      properties:
        id:
          type: string
          description: The identifier of the data product.
          example: data-product-1
        timestamp:
          type: string
          format: date-time
          description: The business time when the data product was created
          example: 2023-01-01T09:15:20.705Z
    DataProductUpdatedEvent:
      type: object
      description: A data product was updated.
      required:
        - id
        - timestamp
      properties:
        id:
          type: string
          description: The identifier of the data product.
          example: data-product-1
        timestamp:
          type: string
          format: date-time
          description: The business time when the data product was updated
          example: 2023-01-01T09:15:20.705Z
    DataProductDeletedEvent:
      type: object
      description: A data product was deleted.
      required:
        - id
        - timestamp
      properties:
        id:
          type: string
          description: The identifier of the data product.
          example: data-product-1
        timestamp:
          type: string
          format: date-time
          description: The business time when the data product was deleted
          example: 2023-01-01T09:15:20.705Z
    OutputPortCreatedEvent:
      type: object
      description: An output port was created. This event is emitted in addition to a DataProductCreatedEvent or DataProductUpdatedEvent.
      required:
        - id
        - outputPortId
        - timestamp
      properties:
        id:
          type: string
          description: The identifier of the data product.
          example: data-product-1
        outputPortId:
          type: string
          description: The identifier of the output port.
          example: data-product-1
        timestamp:
          type: string
          format: date-time
          description: The business time when the data product was created
          example: 2023-01-01T09:15:20.705Z
    OutputPortUpdatedEvent:
      type: object
      description: An output port was updated. This event is emitted in addition to a DataProductUpdatedEvent.
      required:
        - id
        - outputPortId
        - timestamp
      properties:
        id:
          type: string
          description: The identifier of the data product.
          example: data-product-1
        outputPortId:
          type: string
          description: The identifier of the output port.
          example: data-product-1
        timestamp:
          type: string
          format: date-time
          description: The business time when the data product was updated
          example: 2023-01-01T09:15:20.705Z
    OutputPortDeletedEvent:
      type: object
      description: An output port was deleted. This event is emitted in addition to a DataProductUpdatedEvent or DataProductDeletedEvent.
      required:
        - id
        - outputPortId
        - timestamp
      properties:
        id:
          type: string
          description: The identifier of the data product.
          example: data-product-1
        outputPortId:
          type: string
          description: The identifier of the output port.
          example: data-product-1
        timestamp:
          type: string
          format: date-time
          description: The business time when the data product was deleted
          example: 2023-01-01T09:15:20.705Z
    DataContractBranch:
      type: object
      description: "A branch of a data contract: a hidden copy of it, where changes are authored before they land."
      properties:
        name:
          type: string
          readOnly: true
          description: The branch name, as it was cut.
          example: add-order-status
        data_contract_id:
          type: string
          readOnly: true
          description: The data contract the branch was cut from.
          example: orders_v1
        branch_data_contract_id:
          type: string
          readOnly: true
          description: The hidden id the branch is stored under. Informational — the data contract endpoints refuse it; author through `…/branches/{branch}/datacontract.yaml`.
          example: branch-orders_v1-add-order-status
        version:
          type: string
          readOnly: true
          description: The version the branch's document carries.
          example: 1.1.0
        target_version:
          type: string
          readOnly: true
          description: The data contract's current version.
          example: 1.0.0
        version_state:
          type: string
          readOnly: true
          enum: [ready, needsBump, majorDiffers]
          description: Whether the branch can land with its version as it is (`ready`), needs a version passed to merge (`needsBump`), or changed the major version and cannot land from a branch (`majorDiffers`).
        suggested_step:
          type: string
          readOnly: true
          enum: [patch, minor, major]
          description: The step the branch's changes call for. Wording and metadata alone are a `patch`; added or restructured elements a `minor`; a removed or retyped column, table or server a `major`, which a branch cannot carry.
        suggested_version:
          type: string
          readOnly: true
          description: The version that step comes to on the data contract, to pass to merge when the branch has not raised its own. A `major` step is offered as the next minor version.
          example: 1.1.0
        breaking_changes:
          type: array
          readOnly: true
          description: The columns, tables or servers the branch removes or retypes, which make the step a `major` one. Empty otherwise.
          items:
            type: string
        change_count:
          type: integer
          readOnly: true
          description: How many elements the branch changes against the data contract.
        behind_target:
          type: boolean
          readOnly: true
          description: Whether the data contract has changed since the branch was last updated from it.
        conflicted:
          type: boolean
          readOnly: true
          description: Whether the last replay onto the data contract disagreed. A conflicted branch cannot be merged until its author resolves it.
        conflicts:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/DataContractBranchConflict'
        merge_request:
          readOnly: true
          description: The pull/merge request opened from the branch, while one is open. Its live fields are filled when reading a single branch and left out in the list.
          allOf:
            - $ref: '#/components/schemas/SemanticBranchMergeRequest'
    DataContractBranchConflict:
      type: object
      properties:
        key:
          type: string
          description: The element, as `type:path`.
          example: property:ORDERS.ORDER_STATUS
        element_type:
          type: string
          enum: [field, schema, property, server, role, sla, member, support, customProperty, definition, tag]
        name:
          type: string
          example: ORDER_STATUS
        reason:
          type: string
          enum: [bothChanged, changedHereRemovedThere, removedHereChangedThere, bothAdded]
    DataContractBranchChange:
      type: object
      description: One element a branch changes against its data contract.
      properties:
        key:
          type: string
          example: property:ORDERS.ORDER_STATUS
        element_type:
          type: string
          enum: [field, schema, property, server, role, sla, member, support, customProperty, definition, tag]
        path:
          type: string
          description: The element's path; a property's is `SCHEMA.PROPERTY[.NESTED]`.
          example: ORDERS.ORDER_STATUS
        name:
          type: string
          example: ORDER_STATUS
        op:
          type: string
          enum: [add, modify, remove]
        impact:
          type: string
          enum: [structural, descriptive, cosmetic]
        fields:
          type: array
          description: Per-field before/after pairs of a modified element; empty for an addition or a removal.
          items:
            $ref: '#/components/schemas/SemanticBranchFieldChange'
