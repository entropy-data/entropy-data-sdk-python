  /api/v1/traces:
    get:
      tags:
        - Usage
      summary: Get traces
      description: |
        Retrieve OpenTelemetry traces filtered by scope name, data product ID, data contract ID, and start time. All given filters apply together. Returns traces in OTLP/JSON format, newest spans first.

        OTLP itself only defines sending traces; this read endpoint is Entropy Data's own. Paging uses the `p` and `size` query parameters and a `Link` header, so the body stays an OTLP/JSON document.
      operationId: getTraces
      parameters:
        - name: scopeName
          in: query
          description: Filter traces by scope name (e.g., "usage")
          required: false
          schema:
            type: string
            example: usage
        - name: dataProductId
          in: query
          description: Filter traces by data product external ID
          required: false
          schema:
            type: string
            example: orders
        - name: dataContractId
          in: query
          description: Filter traces by data contract external ID
          required: false
          schema:
            type: string
            example: snowflake_orders_pii_v2
        - name: from
          in: query
          description: Only items whose span start time is at or after this instant (inclusive). An ISO-8601 date-time with offset, or a date, meaning that day's start in UTC.
          required: false
          schema:
            type: string
          example: 2026-10-01T00:00:00Z
        - name: to
          in: query
          description: Only items whose span start time is before this instant (exclusive). Same format as `from`.
          required: false
          schema:
            type: string
          example: 2026-10-08
        - name: p
          in: query
          description: The number of the requested page, starting from 0. Use the Link header with rel="next" to navigate to the next page. Without `p` and `size` all spans are returned in one response.
          required: false
          schema:
            type: integer
            minimum: 0
          example: 0
        - name: size
          in: query
          description: The maximum number of spans per page (default 100, at most 1000).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          example: 100
      responses:
        200:
          description: Traces in OTLP/JSON format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtelTracesRequest'
        400:
          description: Invalid `from`, `to`, `p`, or `size`
        404:
          description: The data product or data contract does not exist
    post:
      tags:
        - Usage
      summary: Submit traces
      description: |
        Submit OpenTelemetry traces in OTLP/JSON format to track data product usage. Traces should include:
        - Resource attributes: `service.name`, `dataproduct.id`, `outputport.name`
        - Span attributes: `user`, `role`, `type`, `query`, `rows`, `result`, `access.id`

        Traces older than 30 days are automatically deleted. Spans with duplicate `spanId` values are updated (upserted).
      operationId: postTraces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtelTracesRequest'
            example:
              resourceSpans:
                - resource:
                    attributes:
                      - key: service.name
                        value:
                          stringValue: snowflake
                      - key: dataproduct.id
                        value:
                          stringValue: orders
                      - key: outputport.name
                        value:
                          stringValue: snowflake_orders_pii_v2
                  scopeSpans:
                    - scope:
                        name: usage
                        version: 1.0.0
                      spans:
                        - traceId: trace001
                          spanId: span001
                          kind: SPAN_KIND_INTERNAL
                          startTimeUnixNano: 1704067200000000000
                          endTimeUnixNano: 1704067260000000000
                          attributes:
                            - key: user
                              value:
                                stringValue: ANALYTICS_TEAM
                            - key: role
                              value:
                                stringValue: ANALYST
                            - key: type
                              value:
                                stringValue: query
                            - key: query
                              value:
                                stringValue: SELECT * FROM orders WHERE date > '2024-01-01'
                            - key: rows
                              value:
                                intValue: 1523
                            - key: result
                              value:
                                stringValue: success
                            - key: access.id
                              value:
                                stringValue: access-abc123
      responses:
        200:
          description: Traces successfully submitted
    delete:
      tags:
        - Usage
      summary: Delete traces
      description: Delete traces filtered by scope name, data product ID, data contract ID, or span ID. If no filters are provided, all traces for the organization are deleted.
      operationId: deleteTraces
      parameters:
        - name: scopeName
          in: query
          description: Delete traces with this scope name
          required: false
          schema:
            type: string
            example: usage
        - name: dataProductId
          in: query
          description: Delete traces for this data product external ID
          required: false
          schema:
            type: string
            example: orders
        - name: dataContractId
          in: query
          description: Delete traces for this data contract external ID
          required: false
          schema:
            type: string
            example: snowflake_orders_pii_v2
        - name: spanId
          in: query
          description: Delete a specific trace by span ID
          required: false
          schema:
            type: string
            example: span001
      responses:
        200:
          description: Traces deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount:
                    type: integer
                    description: Number of traces deleted
                    example: 42
  /api/v1/lineage:
    post:
      tags:
        - Lineage
      summary: Submit OpenLineage event
      description: |
        Submit an OpenLineage RunEvent. Compatible with all OpenLineage producers (dbt-ol, Airflow, Spark, Flink, etc.).

        **Linking to data products:** Use either query parameters or the `entropy_data` run facet:

        Option 1 — Query parameters (via `urlParams` in OpenLineage transport config):
        ```yaml
        # openlineage.yml
        transport:
          type: http
          url: https://api.entropy-data.com
          endpoint: api/v1/lineage
          auth:
            type: api_key
            api_key: <entropy-data-api-key>
          urlParams:
            dataProductId: orders
            outputPortName: snowflake_orders_v2
        ```

        Option 2 — `entropy_data` run facet (embedded in event JSON):
        ```json
        {
          "run": {
            "runId": "...",
            "facets": {
              "entropy_data": {
                "_producer": "https://entropy-data.com",
                "_schemaURL": "https://entropy-data.com/spec/facets/1-0-0/EntropyDataRunFacet.json",
                "dataProductId": "orders",
                "outputPortName": "snowflake_orders_v2"
              }
            }
          }
        }
        ```

        Query parameters take precedence over the facet. Input/output datasets can also carry
        an `entropy_data` facet with an `assetId` to link datasets to Entropy Data assets.

        Events older than 90 days are automatically deleted.
      operationId: postLineageEvent
      parameters:
        - name: dataProductId
          in: query
          description: Data product external ID to associate the event with
          required: false
          schema:
            type: string
            example: orders
        - name: outputPortName
          in: query
          description: Output port name within the data product. Used to auto-resolve the data contract.
          required: false
          schema:
            type: string
            example: snowflake_orders_v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenLineageRunEvent'
            example:
              eventType: COMPLETE
              eventTime: "2024-01-15T10:00:00.000Z"
              run:
                runId: "d46e465b-d358-4d32-83d4-df660ff614dd"
              job:
                namespace: dbt
                name: my_model
              inputs:
                - namespace: snowflake://account.snowflakecomputing.com
                  name: raw_db.public.raw_orders
              outputs:
                - namespace: snowflake://account.snowflakecomputing.com
                  name: analytics_db.public.orders
              producer: "https://github.com/OpenLineage/OpenLineage/tree/0.18.0/integration/dbt"
      responses:
        200:
          description: Event successfully submitted
    get:
      tags:
        - Lineage
      summary: Get OpenLineage events
      description: |
        Retrieve stored OpenLineage events filtered by job, run, event type, data product, and event time. All given filters apply together. Events are returned as received, newest first.

        OpenLineage itself only defines sending events; this read endpoint is Entropy Data's own. Paging uses the `p` and `size` query parameters and a `Link` header, so the body stays a plain array of events.
      operationId: getLineageEvents
      parameters:
        - name: jobNamespace
          in: query
          description: Filter by job namespace
          required: false
          schema:
            type: string
            example: dbt
        - name: jobName
          in: query
          description: Filter by job name
          required: false
          schema:
            type: string
            example: my_model
        - name: runId
          in: query
          description: Filter by run ID
          required: false
          schema:
            type: string
        - name: eventType
          in: query
          description: Filter by event type (START, RUNNING, COMPLETE, ABORT, FAIL)
          required: false
          schema:
            type: string
            enum: [START, RUNNING, COMPLETE, ABORT, FAIL]
        - name: dataProductId
          in: query
          description: Filter by data product external ID
          required: false
          schema:
            type: string
            example: orders
        - name: from
          in: query
          description: Only items whose event time is at or after this instant (inclusive). An ISO-8601 date-time with offset, or a date, meaning that day's start in UTC.
          required: false
          schema:
            type: string
          example: 2026-10-01T00:00:00Z
        - name: to
          in: query
          description: Only items whose event time is before this instant (exclusive). Same format as `from`.
          required: false
          schema:
            type: string
          example: 2026-10-08
        - name: p
          in: query
          description: The number of the requested page, starting from 0. Use the Link header with rel="next" to navigate to the next page. Without `p` and `size` all events are returned in one response.
          required: false
          schema:
            type: integer
            minimum: 0
          example: 0
        - name: size
          in: query
          description: The maximum number of events per page (default 100, at most 1000).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          example: 100
      responses:
        200:
          description: List of OpenLineage events as raw JSON
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenLineageRunEvent'
        400:
          description: Invalid `from`, `to`, `p`, or `size`
        404:
          description: The data product does not exist
    delete:
      tags:
        - Lineage
      summary: Delete OpenLineage events
      description: Delete OpenLineage events filtered by run ID, or job namespace and name. If no filters are provided, all events for the organization are deleted.
      operationId: deleteLineageEvents
      parameters:
        - name: runId
          in: query
          description: Delete events for this run ID
          required: false
          schema:
            type: string
        - name: jobNamespace
          in: query
          description: Delete events for this job namespace (requires jobName)
          required: false
          schema:
            type: string
            example: dbt
        - name: jobName
          in: query
          description: Delete events for this job name (requires jobNamespace)
          required: false
          schema:
            type: string
            example: my_model
      responses:
        200:
          description: Events deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount:
                    type: integer
                    description: Number of events deleted
                    example: 5
