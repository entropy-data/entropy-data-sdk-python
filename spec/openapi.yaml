      responses:
        200:
          description: The saved issuer
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/AgentTokenIssuer'
    delete:
      tags:
        - Agent Identities
      summary: Delete a trusted issuer of agent tokens
      operationId: deleteAgentTokenIssuer
      responses:
        200:
          description: Tokens from this issuer are no longer accepted
