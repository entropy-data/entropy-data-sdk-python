  /api/settings/team-roles:
    get:
      tags:
        - Team Roles
      summary: Get the team roles configuration
      description: >-
        Report whether team permissions are derived from the built-in default
        roles or from this organization's custom team role catalog. When the
        mode is `custom-team-roles`, the full catalog is returned in
        `team-roles`, sorted by `rank` ascending.
      operationId: getTeamRoles
      responses:
        200:
          description: The current team roles configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRolesSettings'
        403:
          $ref: "#/components/responses/Forbidden"
    put:
      tags:
        - Team Roles
      summary: Set the team roles configuration
      description: >-
        Switch between the built-in default roles and a custom team role
        catalog.


        - `mode: default` activates the built-in default roles. Any existing
        custom roles are kept untouched (the switch is reversible), so
        `team-roles` is ignored.

        - `mode: custom-team-roles` activates the custom catalog and **replaces**
        it with exactly the roles in `team-roles` (matched by `name`). Roles not
        listed are deleted. Switching to custom with an empty or missing
        `team-roles` is rejected with 409, because an empty catalog would strip
        every member of all permissions. Dropping a role still assigned to a team
        member is likewise rejected with 409.
      operationId: putTeamRoles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRolesSettings'
      responses:
        200:
          description: The updated team roles configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRolesSettings'
        400:
          description: Invalid request — unknown mode, unknown permission, or duplicate role names
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        403:
          $ref: "#/components/responses/Forbidden"
        409:
          $ref: "#/components/responses/Conflict"
  /api/api-keys:
    post:
      tags:
        - API Keys
      summary: Create an API key
      description: |
        Create a new team-scoped API key. Only `team` and `team_read` scopes are supported through the API. Requires `TEAM_API_KEY_MANAGE` on the team.

        The new key carries a list of permissions it may write with. Omit `permissions` for everything the calling key holds on the team; pass an empty list for a read-only key. A key never grants more than the caller holds on the team.
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scope
              properties:
                displayName:
                  type: string
                  description: A human-readable name for the API key.
                scope:
                  type: string
                  enum:
                    - team
                    - team_read
                  description: "The scope of the API key. `team`: full read/write access to the team's resources. `team_read`: read-only access to the team's resources."
                teamId:
                  type: string
                  description: The ID of the team this API key is scoped to, as used in `/api/teams/{externalId}`.
                expiresAt:
                  type: string
                  format: date
                  description: Optional expiration date for the API key. The key stays valid through the end of this day (UTC). Omit for a key that never expires.
                permissions:
                  type: array
                  items:
                    type: string
                  description: |
                    Team permissions the key may write with, by name (as on the roles page, e.g. `DATAPRODUCT_EDIT`). Omitted: everything the calling key holds on the team. Empty: a read-only key, the same as scope `team_read`. Retired generic names such as `RESOURCES_EDIT` are accepted and expanded. Unknown names and `ORGANIZATION_ADMIN` are rejected; a permission the caller does not hold on the team is refused with 403.
            example:
              displayName: "CI/CD Pipeline Key"
              scope: "team"
              teamId: "checkout"
              expiresAt: "2026-12-31"
              permissions: ["DATAPRODUCT_ADD", "DATAPRODUCT_EDIT", "DATACONTRACT_EDIT"]
      responses:
        201:
          description: API key created successfully. The `key` field contains the secret API key and is only returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        400:
          $ref: "#/components/responses/BadRequest"
          description: Invalid scope, an unknown permission name, `ORGANIZATION_ADMIN` on a team key, or a non-empty list with `team_read`.
        403:
          $ref: "#/components/responses/Forbidden"
          description: Missing `TEAM_API_KEY_MANAGE` on the team, or a requested permission the caller does not hold there.
        404:
          $ref: "#/components/responses/NotFound"
          description: No team with the given `teamId` exists in this organization.
