      - name: clientId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
        - Agent Identities
      summary: Delete an agent's OAuth client
      description: The client can't obtain new tokens. Tokens it already holds stop working at once.
      operationId: deleteAgentOAuthClient
      responses:
        200:
          description: The client was deleted
