  /api/agent-token-issuers:
    get:
      tags:
        - Agent Identities
      summary: List trusted issuers of agent tokens
      description: Requires an organization key with ORGANIZATION_ADMIN.
      operationId: getAgentTokenIssuers
      responses:
        200:
          description: The organization's trusted issuers
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentTokenIssuer'
  /api/agent-token-issuers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        example: entra
        schema:
          type: string
    put:
      tags:
        - Agent Identities
      summary: Add or update a trusted issuer of agent tokens
      description: |
        Accepts access tokens that an identity provider issues to an agent, such as a Microsoft Entra
        Agent ID token. A Bearer token on /mcp or /api whose issuer and audience match is validated
        against the issuer's signing keys; the value of the configured claim is then matched against the
        linked identities of the organization's agents of the configured type. A match acts as that
        agent. Requires an organization key with ORGANIZATION_ADMIN.
      operationId: putAgentTokenIssuer
      requestBody:
        required: true
        content:
          'application/json':
            schema:
