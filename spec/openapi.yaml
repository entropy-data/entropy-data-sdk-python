      summary: Create an OAuth client for an agent
      description: |
        Creates an OAuth client for the client credentials grant. The client secret is returned once,
        in this response. Exchange the client id and secret at /oauth2/token
        (grant_type=client_credentials, HTTP Basic client authentication) for a short-lived access token,
        and send it as a Bearer token to /mcp or /api. The token acts as the agent, with the agent's
        permissions. Requires TEAM_API_KEY_MANAGE on the owning team.
      operationId: createAgentOAuthClient
