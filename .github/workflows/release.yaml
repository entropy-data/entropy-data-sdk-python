on:
  push:
    tags: ["v[0-9]+", "v[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

name: Release
jobs:
  test:
    uses: ./.github/workflows/ci.yaml

  check_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag version == pyproject.version
        run: |
          pip install toml-cli
          PROJECT_VERSION=$(toml get --toml-path pyproject.toml project.version)
          TAG=$(git describe HEAD --tags --abbrev=0)
          echo "TAG: $TAG, PROJECT_VERSION: $PROJECT_VERSION"
          if [[ "$TAG" != "v$PROJECT_VERSION" ]]; then exit 1; fi

  build:
    runs-on: ubuntu-latest
    needs:
      - test
      - check_version
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Build package
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: release-pypi
      url: https://pypi.org/p/entropy-data-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create a GitHub Release
    needs:
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract changelog for version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '/^## \[/ { printing = index($0, "[" v "]") > 0 } printing' CHANGELOG.md > release_notes.md
          cat release_notes.md
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create '${{ github.ref_name }}'
          --repo '${{ github.repository }}'
          --notes-file release_notes.md
          dist/*
